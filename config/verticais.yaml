# Mapeamento de fontes -> verticais.
# Verticais: linhas_financeiras | saude | ramos_elementares | linhas_pessoais

pipedrive:
  # pipeline_id -> vertical. Deduzido pelo conteúdo dos negócios de cada funil.
  # Pipelines ausentes daqui são ignorados.
  pipelines:
    1: linhas_financeiras    # D&O, Cyber
    23: saude                # Saúde / Vida (Pipo)
    29: ramos_elementares    # Eventos, Transportes
    34: saude                # "Saúde 2025", criados via API (Pipo)
    38: saude                # Leads Flash Saúde
    40: linhas_financeiras   # Seguro Garantia
    # 31: linhas_financeiras # M&A (parado desde 2024) — CONFIRMAR
    # 39: linhas_financeiras # Canais/parcerias (Cyber + outros) — CONFIRMAR

# Usuários internos. "verticais" define em quais verticais a pessoa atua
# (e cujos e-mails são lidos); "lider" é quem recebe as oportunidades da vertical.
usuarios:
  - email: bruno.rodrigues@innoaseguros.com.br
    nome: Bruno Rodrigues
    verticais: [ramos_elementares]
    lider: [ramos_elementares]
  - email: victor.boldrini@innoaseguros.com.br
    nome: Victor Boldrini
    verticais: [linhas_financeiras]
    lider: [linhas_financeiras]
  - email: pedro.acciari@innoaseguros.com.br
    nome: Pedro Acciari
    verticais: [linhas_financeiras, saude]
  - email: pamela.silva@innoaseguros.com.br
    nome: Pamela Silva
    verticais: [saude, linhas_financeiras]

# Mapeamento de colunas das planilhas exportadas. Os nomes à direita são os
# cabeçalhos da planilha (comparação sem acento/maiúsculas).
importacao:
  zeca:
    cnpj: [cnpj, cnpj estipulante, documento]
    razao_social: [razao social, estipulante, empresa, cliente]
    produto: [produto, plano, ramo]
    operadora: [operadora, seguradora]
    numero_apolice: [apolice, contrato, numero contrato, numero apolice]
    inicio_vigencia: [inicio vigencia, vigencia inicial, inicio]
    fim_vigencia: [fim vigencia, vigencia final, renovacao, aniversario]
    premio: [premio, faturamento, valor, premio mensal]
    vidas: [vidas, beneficiarios, quantidade vidas]
    status: [status, situacao]
  quiver:
    documento: [cpf/cnpj, cpf, cnpj, documento]
    nome: [cliente, nome, segurado]
    email: [email, e-mail]
    produto: [produto, ramo]
    seguradora: [seguradora, cia]
    numero_apolice: [apolice, numero apolice]
    inicio_vigencia: [inicio vigencia, vigencia inicial]
    fim_vigencia: [fim vigencia, vigencia final]
    premio: [premio, premio liquido, premio total]
    status: [status, situacao]
