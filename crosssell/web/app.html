<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innoa Cross Sell</title>
<link rel="icon" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: barra com abas + coluna de 1320px; a tabela de negócios é a tela principal, rolagem horizontal própria */
:root{
  /* Identidade Innoa: azul-marinho #02024E (marca) e azul #0554F2 (destaque) */
  --brand:#02024E; --brand-ink:#ffffff;
  --bg:#f7f8fa; --surface:#ffffff; --ink:#0f1140; --mute:#5a5d80; --line:#dfe1ee; --soft:#eef0f8;
  --accent:#0554F2; --accent-ink:#ffffff; --warn:#a15c00; --good:#1d7a46; --bad:#b42318;
  --lf:#6a3fd1; --saude:#12805c; --re:#b86a00; --canal:#4a5a6a;
  --quente:#c2410c; --morna:#a16207; --fria:#0554F2;
  color-scheme:light;
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding-inline:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1320px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-height:60px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;color:var(--brand);text-decoration:none}
.brand img{height:26px;width:auto;display:block}
.brand .logo-escuro{display:none}
.brand span{font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding-left:10px;border-left:1px solid var(--line);color:var(--mute)}
.top nav.abas a{color:var(--mute)}
.top nav.abas a:hover{color:var(--ink)}
.top nav.abas a[aria-current="page"]{color:var(--brand);font-weight:600;border-bottom-color:var(--accent);border-bottom-width:3px}
nav.abas{display:flex;gap:2px;align-self:stretch;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.abas a{flex:none}
nav.abas a{display:flex;align-items:center;padding:0 12px;color:var(--mute);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
nav.abas a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.top .dir{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mute)}
.pill-demo{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--warn);border:1px solid var(--line)}
main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;gap:18px}
h1{font:700 21px/1.2 var(--f-display);margin:0;text-wrap:balance}
h2{font:700 15px/1.2 var(--f-display);margin:0 0 10px}
.mute{color:var(--mute)} .small{font-size:12px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:500;padding:1px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.chip.solid{background:var(--c);color:var(--surface);border-color:var(--c)}
.chip.off{--c:var(--mute);border-style:dashed;background:transparent}
.c-linhas_financeiras{--c:var(--lf)} .c-saude{--c:var(--saude)} .c-ramos_elementares{--c:var(--re)} .c-null,.c-canal{--c:var(--canal)}
.t-muita{--c:var(--quente)} .t-media{--c:var(--morna)} .t-pouca{--c:var(--fria)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.chip{cursor:pointer;font:inherit;font-size:12px}
button.chip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
select,input,textarea{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input[type=search]{min-width:0;flex:1 1 200px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.btn{font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.sec{background:transparent;color:var(--accent)}
.btn.perigo{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tabela{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
table.larga{min-width:1500px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;background:var(--soft);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.score{display:grid;gap:4px;min-width:96px}
.score b{font:600 16px/1 var(--f-data)}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.comp{font-size:11px;color:var(--mute);font-family:var(--f-data);white-space:nowrap}
ul.lista{margin:0;padding-left:16px;display:grid;gap:2px;font-size:13px}
.sub{font-size:12px;color:var(--mute)}
.tag-cli{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--good)}
.tag-lead{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.vig{display:grid;gap:4px;min-width:170px}
.check{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);cursor:pointer}
.not a,.not span:not(.sub){display:block;font-size:12px;line-height:1.35;text-decoration:none}
.not a:hover{text-decoration:underline}
.not .sub{margin-bottom:6px}
.rel{font-size:12px;display:grid;gap:2px;min-width:140px}
.prox{font-size:12px;display:grid;gap:6px;min-width:160px}
.decide{font-size:12px;display:grid;gap:3px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line, #ddd)}
.decide .ponte{margin-top:2px}
.decide.solo{margin-top:0;padding-top:0;border-top:0}
th[data-ajuda]{cursor:help}
th[data-ajuda]::after{content:"?";display:inline-grid;place-items:center;width:14px;height:14px;margin-left:5px;border-radius:50%;
  border:1px solid currentColor;font:600 9px/1 var(--f-body);vertical-align:1px;opacity:.6}
#dica{position:fixed;z-index:40;max-width:340px;background:var(--ink);color:var(--bg);font:400 12.5px/1.45 var(--f-body);
  padding:10px 12px;border-radius:8px;box-shadow:0 6px 24px rgba(2,2,78,.18);pointer-events:none;text-transform:none;letter-spacing:0;white-space:normal}
#dica b{font-weight:600}
ul.motivos{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
ul.motivos li{display:grid;grid-template-columns:16px 1fr;gap:4px;align-items:baseline}
.sinal{font:700 12px/1 var(--f-data);text-align:center}
.mais,.mais .sinal{color:var(--good)} .menos .sinal,.menos{color:var(--bad)} .falta .sinal,.falta{color:var(--mute)} .alerta .sinal,.alerta{color:var(--warn)}
ul.motivos li.mais,ul.motivos li.menos,ul.motivos li.alerta{color:var(--ink)}
ul.motivos li.falta{color:var(--mute)}
.vazio{padding:24px;text-align:center;color:var(--mute)}
.nota{font-size:12px;color:var(--mute);margin:0}
.kpi-row{display:flex;gap:12px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid}
.kpi b{font:700 22px/1.1 var(--f-display)}
.kpi span{font-size:12px;color:var(--mute)}
.paginas{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:8px 14px}
.grupo{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.grupo h3{font:700 14px/1.2 var(--f-display);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grupo ul{list-style:none;margin:0;padding:0}
.grupo li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.grupo li:last-child{border-bottom:0}
.grupo li.feita .ass{text-decoration:line-through;color:var(--mute)}
.atrasada{color:var(--bad);font-weight:600}
.semana{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-fundo{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;width:100%;max-width:460px;display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.modal .acoes{display:flex;gap:8px;justify-content:flex-end}
.erro{color:var(--bad);font-size:13px;margin:0}
.aviso{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30}
.form-linha{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form-linha label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
fieldset label{display:flex;gap:4px;align-items:center}
.link-convite{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:6px;padding:8px 10px;font-size:12px}
.link-convite code{font-family:var(--f-data);word-break:break-all;flex:1 1 260px;min-width:0}
.ficha-head{display:grid;gap:8px}
a.in{display:inline-block;font:600 10px/1 var(--f-body);padding:2px 4px;border-radius:3px;background:var(--accent);color:var(--accent-ink);text-decoration:none;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* Aba Rotina: passos da rodada em linha do tempo e os painéis de e-mail e LinkedIn */
.qual-org{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;border:1px solid transparent}
.qual-org label{display:flex;gap:8px;align-items:flex-start;flex:1;cursor:pointer}
.qual-org .btn{flex:none;font-size:12px;padding:2px 8px}
.qual-org+.qual-org{margin-top:4px}
.qual-org.fica{background:color-mix(in srgb,var(--good) 8%,transparent);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.qual-org input{margin-top:4px}
.crit summary{cursor:pointer;padding:12px 14px;font:700 14px/1.2 var(--f-display)}
.crit-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;padding:0 14px 14px}
.crit-v ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.grupo .crit-v li{display:block;padding:0;border:0}
.crit-linha{display:flex;justify-content:space-between;gap:8px}
.crit-barra{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:3px 0}
.crit-barra i{display:block;height:100%;background:var(--c, var(--accent))}
.crit-barra.c-saude{--c:var(--saude)} .crit-barra.c-linhas_financeiras{--c:var(--lf)} .crit-barra.c-ramos_elementares{--c:var(--re)}
.rot-lk{gap:14px}
.lk-passos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.lk-passos li{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:8px;padding:10px}
.lk-passos li div{display:grid;gap:3px;font-size:13px}
.lk-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-content:center;background:var(--accent);color:#fff;font:800 14px/1 var(--f-display)}
.lk-rodape{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.rot-resumo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch}.rot-resumo>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;font-size:13px}.rot-resumo>div b{font:700 15px/1.2 var(--f-display)}.rot-resumo .seta{align-self:center;color:var(--accent);font-size:20px}.rot-etapa{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-content:center;font:800 13px/1 var(--f-display)}@media (max-width:760px){.rot-resumo{grid-template-columns:1fr}.rot-resumo .seta{display:none}}
.rot-indice{font-size:13px;color:var(--mute)}.rot-titulo{font:700 17px/1.2 var(--f-display);margin:6px 0 0}
.rot-fase{list-style:none;font:700 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:6px 0 8px 58px}
.rot-praque{color:var(--mute);font-size:13px}.rot-praque b{color:var(--ink)}
.lk-4{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.rot-linha{list-style:none;margin:0;padding:0;display:grid;gap:8px;border-left:2px solid var(--line);margin-left:8px}.rot-linha li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding-left:14px;position:relative;font-size:13px}.rot-linha li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}@media (max-width:600px){.rot-linha li{grid-template-columns:1fr}}
.rot-glossario{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}.rot-glossario div{background:var(--soft);border-radius:8px;padding:10px 12px}.rot-glossario dt{font-weight:700}.rot-glossario dd{margin:2px 0 0;font-size:13px}
.rot-vert{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-left:6px solid var(--c, var(--accent));padding:6px 12px;background:var(--surface);border-radius:8px}.rot-vert h2{font:800 20px/1.2 var(--f-display);margin:0}.rot-vert span{color:var(--mute);font-size:13px}.rot-vert.c-saude{--c:var(--saude)}.rot-vert.c-linhas_financeiras{--c:var(--lf)}.rot-vert.c-ramos_elementares{--c:var(--re)}
.rot-secao{display:grid;gap:12px;margin-top:8px}.rot-crit{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rot-fontes td{vertical-align:top;font-size:13px}.rot-fontes td:first-child{white-space:nowrap}
.lk-cotas{display:grid;gap:6px;margin-top:4px}.lk-cotas table{border-collapse:collapse;width:fit-content!important;min-width:0!important}.lk-cotas td{padding:3px 12px 3px 0;border:0}
.lk-ritmo,.lk-exemplo{display:grid;gap:6px;align-content:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.lk-exemplo{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.negociando{max-width:170px}
.negociando .chip{max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.lapis{background:none;border:0;padding:0 2px;color:var(--accent);cursor:pointer;font:inherit;font-size:12px}
.lapis:hover{text-decoration:underline}
.rot-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:18px 20px}
.rot-relogio{flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;border:3px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);background:color-mix(in srgb,var(--accent) 45%,var(--brand))}
.rot-relogio b{font:800 30px/1 var(--f-display)} .rot-relogio span{font-size:11px;opacity:.85}
.rot-hero h2{font:700 18px/1.25 var(--f-display);margin:0 0 4px} .rot-hero p{margin:0;opacity:.88;max-width:760px}
.rot-passos{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rot-passo{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:14px}
.rot-passo:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.rot-num{width:44px;height:44px;border-radius:50%;display:grid;place-content:center;font:800 17px/1 var(--f-display);color:#fff;background:var(--c)}
.rot-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 14px;display:grid;gap:4px}
.rot-card h3{font:700 15px/1.2 var(--f-display);margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rot-card p{margin:0}
.rot-st{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.rot-st i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none} .rot-st.ok i{background:var(--good)} .rot-st.erro i{background:var(--bad)} .rot-st.erro{color:var(--bad)}
.rot-paineis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.rot-painel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;align-content:start}
.rot-painel h2{font:700 16px/1.2 var(--f-display);margin:0}
.rot-fluxo{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.rot-fluxo div{flex:1 1 120px;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;display:grid;gap:2px;align-content:start}
.rot-fluxo div b{font-size:13px;color:var(--ink)}
.rot-fluxo .seta{flex:none;align-self:center;color:var(--accent);font-weight:700;background:none;padding:0}
.rot-fatos{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rot-fatos li{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.rot-fatos li>b{font:800 20px/1 var(--f-display);color:var(--accent);text-align:center}
.rot-fatos li>b small{display:block;font:600 10px/1.2 var(--f-body);color:var(--mute);margin-top:2px}
.rot-medidor{height:10px;border-radius:99px;background:var(--soft);overflow:hidden} .rot-medidor i{display:block;height:100%;background:var(--accent);border-radius:99px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#oportunidades"><img class="logo-claro" src="/static/logo-innoa.png" alt="Innoa Seguros"><img class="logo-escuro" src="/static/logo-innoa-branco.png" alt=""><span>Cross Sell</span></a>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <div class="dir"><span class="pill-demo" id="demo" hidden>Prévia com dados de exemplo · nada é enviado ao Pipedrive</span><span id="eu"></span><a href="/logout" id="sair">Sair</a></div>
</div></header>
<main id="app"><p class="vazio">Carregando…</p></main>
<div id="modal"></div>
<div class="aviso" id="aviso" hidden></div>
<div id="dica" role="tooltip" hidden></div>

<script>
const D = /*__DADOS__*/null;
const PREVIA = !!D;
const TIPOS = {task:"Tarefa", call:"Ligação", meeting:"Reunião", email:"E-mail"};
const TEMP = {muita:"Muita abertura", media:"Média abertura", pouca:"Pouca abertura"};
let V = {}, EU = null, USUARIOS = [], OPS = [];
// Cada troca de tela ganha um número; a resposta de uma tela que já foi trocada é descartada
let VEZ = 0;
const OBSOLETA = "obsoleta";

// Equipe e verticais, carregadas uma vez por página (sem montar a tabela no servidor)
let PESOS = {};  // pesos do Score por vertical (config/criterios.yaml)
async function carregarBase() {
  if (USUARIOS.length && Object.keys(V).length) return;
  const b = await api.get("/api/base"); USUARIOS = b.usuarios; V = b.verticais; PESOS = b.pesos || {};
}
const filtro = {funil:"", dono:"", temp:"", tipo:"", q:""};
const filtroOp = {vertical:"", q:"", tipo:"", rel:"", oferta:"cross", pagina:1};
const POR_PAGINA = 20;
/* Recorte de uma lista no navegador, no mesmo formato que o servidor devolve ({itens, total, pagina, paginas}). */
function pagLocal(lista, n) {
  const paginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA)), pagina = Math.min(Math.max(1, n || 1), paginas);
  return {itens: lista.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA), total: lista.length, pagina, paginas};
}
function paginacao(p, alvo) {
  if (p.paginas <= 1) return "";
  return `<nav class="paginas" data-pag="${alvo}" aria-label="Páginas">
    <button class="btn sec" data-ir="${p.pagina - 1}" ${p.pagina <= 1 ? "disabled" : ""}>‹ Anterior</button>
    <span class="sub">Página ${p.pagina} de ${p.paginas}</span>
    <button class="btn sec" data-ir="${p.pagina + 1}" ${p.pagina >= p.paginas ? "disabled" : ""}>Próxima ›</button></nav>`;
}
function ligarPaginacao(alvo, ir) {
  document.querySelectorAll(`[data-pag="${alvo}"] [data-ir]`).forEach(b => b.onclick = () => ir(+b.dataset.ir));
}

function marcarAjuda(raiz = document) {
  raiz.querySelectorAll("th:not([data-ajuda])").forEach(th => { const a = chaveAjuda(th); if (a) { th.dataset.ajuda = "1"; th.tabIndex = 0; th._ajuda = a; } });

(() => {
  const dica = () => document.getElementById("dica");
  const mostrar = th => {
    const d = dica(); d.innerHTML = th._ajuda; d.hidden = false;
    const r = th.getBoundingClientRect(), w = Math.min(340, innerWidth - 24);
    d.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
    const h = d.offsetHeight, embaixo = r.bottom + 8 + h < innerHeight;
    d.style.top = (embaixo ? r.bottom + 8 : Math.max(8, r.top - h - 8)) + "px";
  };
  const esconder = () => { const d = dica(); if (d) d.hidden = true; };
  document.addEventListener("mouseover", e => { const th = e.target.closest?.("th[data-ajuda]"); th ? mostrar(th) : esconder(); });
  document.addEventListener("focusin", e => { const th = e.target.closest?.("th[data-ajuda]"); th ? mostrar(th) : esconder(); });
  document.addEventListener("scroll", esconder, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") esconder(); });
  new MutationObserver(() => marcarAjuda()).observe(document.getElementById("app"), {childList: true, subtree: true});
})();

// Prévia (exportar_preview.py, sem servidor): os mesmos filtros e a paginação de /api/oportunidades
function opsPrevia(path) {
  const p = new URLSearchParams(path.split("?")[1] || ""), tudo = D.oportunidades || [], verticais = D.verticaisOportunidades || ["saude"];
  if (p.has("empresa")) return {itens: tudo.filter(o => o.empresa.id == p.get("empresa"))};
  const visiveis = tudo.filter(o => verticais.includes(o.vertical)), todas = visiveis.filter(o => o.analisada);
  const fila = Object.fromEntries(verticais.map(v => [v, new Set(visiveis.filter(o => o.vertical === v && !o.analisada && !o.faltando.some(f => FINAIS.includes(f))).map(o => o.empresa.id)).size]));
  const q = (p.get("q") || "").trim().toLowerCase(), v = p.get("vertical"), t = p.get("tipo"), rel = p.get("rel"), oferta = p.get("oferta") || "cross";
  const filtradas = todas.filter(o => (!v || o.vertical === v) && (!q || o.empresa.nome.toLowerCase().includes(q))
    && (!t || (t === "cliente") === o.cliente) && (!rel || (rel === "-" ? !o.relacoes.length : o.relacoes.includes(rel))));
  const ofertas = {cross: filtradas.filter(o => (o.tipo || "cross") === "cross").length, mais_lf: filtradas.filter(o => o.tipo === "mais_lf").length};
  const ls = filtradas.filter(o => (o.tipo || "cross") === oferta);
  return {...pagLocal(ls, +p.get("pagina") || 1), totalGeral: todas.length, relacoes: [...new Set(todas.flatMap(o => o.relacoes))].sort(), verticais, fila, ofertas};
}
function negociosPrevia(path) {

  const ls = todos.filter(n => (!f || n.funil === f) && (!d || n.dono === d) && (!q || (n.empresa?.nome || "").toLowerCase().includes(q) || (n.titulo || "").toLowerCase().includes(q)));

    .forEach(o => (falta[o.empresa.id] = falta[o.empresa.id] || []).push({vertical: o.vertical, nome: o.verticalNome, faltando: o.faltando}));
  ls.forEach(n => { n.temOportunidade = !!n.empresa && com.has(n.empresa.id); n.faltaParaOportunidade = (n.empresa && falta[n.empresa.id]) || []; });

}

      Object.values(D.empresas).forEach(e => (e.pessoas || []).forEach(muda));
      return {cargo: b.cargo, noPipedrive: false};
    }
    if ((m = path.match(/^\/api\/empresas\/(\d+)\/local$/))) {
      const local = b.cidade ? `${b.cidade}/${b.uf}` : null;
      (D.oportunidades || []).filter(o => o.empresa.id == m[1]).forEach(o => Object.assign(o.empresa, {cidade: b.cidade, uf: b.uf, cidadeFonte: b.cidade ? "manual" : null, local}));
      if (D.empresas[m[1]]) Object.assign(D.empresas[m[1]], {cidade: b.cidade, uf: b.uf, cidadeFonte: b.cidade ? "manual" : null});
      (D.negocios || []).filter(n => n.empresa?.id == m[1]).forEach(n => Object.assign(n.empresa, {cidade: b.cidade, uf: b.uf, cidadeFonte: b.cidade ? "manual" : null, local}));
      return {cidade: b.cidade, uf: b.uf, cidadeFonte: b.cidade ? "manual" : null, local};
    }
    if (path === "/api/qualidade/razao") { D.qualidade.sugestoes = D.qualidade.sugestoes.filter(x => x.id !== b.empresa_id); return {ok: true}; }
    if (path === "/api/ia") { this.get("/api/ia"); D.ia.modelo = b.modelo; D.ia.origem = "plataforma"; return D.ia; }
    if (path === "/api/qualidade/ignorar") { D.qualidade.duplicadas = D.qualidade.duplicadas.filter(g => g.chave !== b.chave); D.qualidade.sugestoes = D.qualidade.sugestoes.filter(x => x.chave !== b.chave); D.qualidade.suspeitas = (D.qualidade.suspeitas || []).filter(x => x.chave !== b.chave); return {ok: true}; }
    if (path === "/api/linkedin/endereco") { D.linkedin.naoEncontrados = D.linkedin.naoEncontrados.filter(x => x.id_alvo !== b.id_alvo); return {ok: true}; }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/papel$/))) { const u = D.equipe.find(x => x.id == m[1]); u.papel = b.papel; return u; }
    if (path === "/api/equipe/convidar") {
      const u = {id: ++this.seq, email: b.email.toLowerCase(), nome: b.nome, papel:"membro", ativo:true, verticais:b.verticais, lider:b.lider, pipedrive:false, pendente:true};
      D.equipe.push(u); return {usuario:u, link:"https://(endereço da plataforma)/convite/exemplo-" + u.id};
    }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/desconvidar$/))) { const u = D.equipe.find(x => x.id == m[1]); u.ativo = false; u.leEmails = false; return u; }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/emails$/))) { const u = D.equipe.find(x => x.id == m[1]); if (b.ler && u.pendente) throw new Error("A leitura só pode ser ligada depois que a pessoa entrar na plataforma."); u.leEmails = b.ler; return u; }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/nova-senha$/))) { const u = D.equipe.find(x => x.id == m[1]); return {usuario:u, link:"https://(endereço da plataforma)/redefinir/exemplo-" + u.id}; }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/reenviar$/))) { const u = D.equipe.find(x => x.id == m[1]); u.ativo = true; return {usuario:u, link:"https://(endereço da plataforma)/convite/exemplo-" + u.id}; }
    throw new Error("rota desconhecida");
  },
};

function semanaDe(ref) {
  const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const sex = new Date(seg); sex.setDate(seg.getDate() + 4);
  return [seg, sex];
}
function todosLocal(refIso) {
  const ref = new Date(refIso + "T12:00:00"), [seg, sex] = semanaDe(ref), hoje = iso(new Date());
  const ini = iso(seg), fim = iso(sex);
  const itens = D.atividades.filter(a => (!a.concluida && a.vencimento <= fim) || (a.concluida && a.vencimento >= ini && a.vencimento <= fim))
    .map(a => ({...a, atrasada: !a.concluida && a.vencimento < hoje})).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  return {inicio: ini, fim, itens};
}

// A API devolve uma página (20) já filtrada: {itens, total, pagina, paginas, totalGeral, relacoes}
let OPS_RESP = null, OPS_SEQ = 0, OPS_BUSCA = 0;
function urlOps() {
  const p = new URLSearchParams({pagina: filtroOp.pagina});
  for (const k of ["vertical", "tipo", "rel", "q", "oferta"]) if (filtroOp[k]) p.set(k, filtroOp[k]);
  return "/api/oportunidades?" + p;
}
async function buscarOps() {  // devolve null se um pedido mais novo (outro filtro ou página) passou na frente
  const seq = ++OPS_SEQ;
  const r = await api.get(urlOps());
  if (seq !== OPS_SEQ) return null;
  OPS_RESP = r; OPS = r.itens;
  return r;
}
function mostrarOps() {
  const r = OPS_RESP;
  OPS = r.itens; filtroOp.pagina = r.pagina;
  document.getElementById("ops").innerHTML = r.itens.length ? r.itens.map(opHTML).join("") : `<tr><td colspan="9" class="vazio">Nenhuma oportunidade com esses filtros.</td></tr>`;
  const fila = Object.values(r.fila || {}).reduce((a, b) => a + b, 0);
  const of = r.ofertas || {}, sel = document.getElementById("f-oferta-op");
  if (sel) sel.innerHTML = `<option value="cross">Cross sell (${of.cross ?? r.total})</option><option value="mais_lf" ${filtroOp.oferta === "mais_lf" ? "selected" : ""}>Mais produtos em LF (${of.mais_lf ?? 0})</option>`;
  document.getElementById("contagem-op").innerHTML = `${r.total} de ${r.totalGeral} analisadas`
    + (fila ? ` · <span title="Empresas esperando a análise. Saúde: cidade, funcionários, setor. LF: Receita, notícias, site, cargos-chave. Nas duas: quem decide e ponte por e-mail. A fila anda pelo Score; preencher cidade e funcionários à mão adianta.">${fila} na fila de análise</span>` : "");
  document.getElementById("pag-op").innerHTML = paginacao(r, "op");
  ligarPaginacao("op", async n => { filtroOp.pagina = n;
    try { if (await buscarOps()) { mostrarOps(); document.getElementById("ops").closest(".tabela").scrollIntoView({block: "start"}); } }
    catch (err) { aviso(err.message); } });
}
async function filtrarOps() {
  try { if (await buscarOps()) mostrarOps(); } catch (err) { aviso(err.message); }
}
async function telaOportunidades() {
  await carregarBase();
  if (!OPS_RESP) { if (!await buscarOps()) return; desenharOportunidades(); return; }
  // Já carregada antes: mostra na hora e atualiza em segundo plano
  desenharOportunidades();
  const antes = JSON.stringify(OPS_RESP);
  if (!await buscarOps() || JSON.stringify(OPS_RESP) === antes) return;
  // Redesenhar tudo tiraria o cursor da busca; digitando, atualiza só as linhas
  if (document.activeElement?.id === "f-q-op") mostrarOps(); else desenharOportunidades();
}

    ${secao("andamento", "Em andamento", "Nada em andamento.")}
    ${secao("feita", "Feitas", "Nada concluído ainda.")}

    <p class="nota">Todos da equipe podem anotar. Só o master muda a situação; quem anotou pode ajustar a prioridade.</p>

/* Cadastros suspeitos: marcar um a um ou o grupo inteiro e excluir no Pipedrive (em lotes de 20). */
function qualSuspeitas() {
  const lista = QUAL.suspeitas || [], el = document.getElementById("q-susp");
  const sel = QUAL.selSusp = new Set([...(QUAL.selSusp || [])].filter(id => lista.some(x => x.id === id)));
  if (!lista.length) { el.innerHTML = '<p class="vazio">Nenhum cadastro suspeito.</p>'; return; }
  const grupos = [];
  lista.forEach(x => { const g = grupos.find(y => y.motivo === x.motivo); g ? g.itens.push(x) : grupos.push({motivo: x.motivo, nome: x.motivoNome, itens: [x]}); });
  const contagem = x => `${x.negocios} negócios${x.ganhos ? ` (${x.ganhos} ganhos)` : ""} · ${x.pessoas} pessoas`;
  el.innerHTML = `<div class="semana" style="padding:8px 12px">
      <button class="btn" id="q-susp-excluir" ${sel.size ? "" : "disabled"}>Excluir selecionadas no Pipedrive${sel.size ? ` (${sel.size})` : ""}</button>
      <span class="sub">Negócios, pessoas e atividades continuam no Pipedrive, só sem a organização. Não tem volta.</span></div>
    <div class="tabela" style="border:0;border-radius:0"><table><tbody>
    ${grupos.map(g => `<tr style="background:var(--soft)"><td style="width:1%"><input type="checkbox" data-susp-grupo="${esc(g.motivo)}" aria-label="Selecionar todas: ${esc(g.nome)}" ${g.itens.every(x => sel.has(x.id)) ? "checked" : ""}></td>
        <td colspan="3"><b>${esc(g.nome)}</b> <span class="sub">${g.itens.length} ${g.itens.length === 1 ? "organização" : "organizações"} · marque aqui para selecionar todas</span></td></tr>
      ${g.itens.map(x => `<tr>
        <td><input type="checkbox" data-susp="${x.id}" aria-label="Selecionar ${esc(x.nome)}" ${sel.has(x.id) ? "checked" : ""}></td>
        <td><b>${esc(x.nome || "(sem nome)")}</b> <span class="sub">· org ${x.orgId}</span></td>
        <td class="sub" ${x.ganhos ? 'style="color:var(--warn)" title="Tem negócio ganho: confira antes de excluir"' : ""}>${contagem(x)}</td>
        <td style="white-space:nowrap;text-align:right"><button class="btn sec" data-susp-ok="${esc(x.chave)}">Não é suspeita</button></td></tr>`).join("")}`).join("")}
    </tbody></table></div>`;
  const btn = document.getElementById("q-susp-excluir");
  const marcar = () => {
    btn.disabled = !sel.size; delete btn.dataset.confirmar;
    btn.textContent = `Excluir selecionadas no Pipedrive${sel.size ? ` (${sel.size})` : ""}`;
    el.querySelectorAll("[data-susp-grupo]").forEach(c => c.checked = lista.filter(x => x.motivo === c.dataset.suspGrupo).every(x => sel.has(x.id)));
  };
  el.querySelectorAll("[data-susp]").forEach(c => c.onchange = () => { c.checked ? sel.add(+c.dataset.susp) : sel.delete(+c.dataset.susp); marcar(); });
  el.querySelectorAll("[data-susp-grupo]").forEach(c => c.onchange = () => {
    lista.filter(x => x.motivo === c.dataset.suspGrupo).forEach(x => c.checked ? sel.add(x.id) : sel.delete(x.id));
    el.querySelectorAll("[data-susp]").forEach(i => i.checked = sel.has(+i.dataset.susp)); marcar();
  });
  btn.onclick = async () => {
    const ids = [...sel];
    if (btn.dataset.confirmar !== "1") { btn.dataset.confirmar = "1"; btn.textContent = `Confirmar: excluir ${ids.length} no Pipedrive, não tem volta`; return; }
    el.querySelectorAll("button, input").forEach(x => x.disabled = true);
    const total = {excluidas: 0, falhas: 0, erros: []};
    try {
      for (let i = 0; i < ids.length; i += 20) {
        btn.textContent = `Excluindo… ${i} de ${ids.length}`;
        const r = await api.post("/api/qualidade/excluir", {ids: ids.slice(i, i + 20)});
        total.excluidas += r.excluidas; total.falhas += r.falhas; total.erros.push(...r.erros);
      }
    } catch (err) { total.erros.push(err.message); }
    aviso(`${total.excluidas} organizações excluídas${PREVIA ? " na prévia (nada foi enviado)" : " no Pipedrive"}`
      + (total.erros.length ? ` · falharam: ${total.erros.join(" · ")}` : ""));
    QUAL.selSusp = new Set();

  };

    try { await api.post("/api/qualidade/ignorar", {chave: b.dataset.suspOk}); QUAL.suspeitas = lista.filter(x => x.chave !== b.dataset.suspOk); qualSuspeitas(); qualKpis(); }
    catch (err) { aviso(err.message); b.disabled = false; }
  });
}
/* Mesclagem em lote das organizações com o nome exatamente igual: o servidor faz 10 grupos por chamada
   (conferindo cada nome no Pipedrive) e a tela chama de novo até acabar. */
function qualNomes() {
  const n = QUAL.nomesIdenticos || {grupos: 0, organizacoes: 0}, el = document.getElementById("q-nomes");
  el.innerHTML = n.grupos ? `<div class="semana" style="padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)">
      <button class="btn" id="q-nomes-btn">Mesclar todas com nome idêntico (${n.grupos.toLocaleString("pt-BR")} grupos)</button>
      <span class="sub">${n.organizacoes.toLocaleString("pt-BR")} organizações com exatamente o mesmo nome de outra (letras, acentos e maiúsculas iguais), mesmo com CNPJ diferente ou em branco. Cada nome é conferido no Pipedrive antes. Nomes parecidos continuam abaixo para análise.</span></div>` : "";
  const b = document.getElementById("q-nomes-btn");
  if (b) b.onclick = async () => {
    if (b.dataset.confirmar !== "1") { b.dataset.confirmar = "1"; b.textContent = `Confirmar: mesclar ${n.organizacoes.toLocaleString("pt-BR")} organizações, não tem volta`; return; }
    document.querySelectorAll("#app button, #app input").forEach(x => x.disabled = true);
    const total = {mescladas: 0, grupos: 0, conferir: 0, falhas: 0, erros: []};
    let apos = "", restantes = n.grupos;
    try {
      do {
        b.textContent = `Mesclando… ${(n.grupos - restantes).toLocaleString("pt-BR")} de ${n.grupos.toLocaleString("pt-BR")} grupos`;
        const r = await api.post("/api/qualidade/mesclar-nomes-identicos", {apos});
        ["mescladas", "grupos", "conferir", "falhas"].forEach(k => total[k] += r[k]);
        total.erros.push(...r.erros);
        apos = r.apos; restantes = r.restantes;
      } while (restantes > 0);
    } catch (err) { total.erros.push(err.message); }
    aviso(`${total.mescladas.toLocaleString("pt-BR")} organizações mescladas em ${total.grupos.toLocaleString("pt-BR")} grupos${PREVIA ? " na prévia (nada foi enviado)" : " no Pipedrive"}`
      + (total.conferir ? ` · ${total.conferir} grupos tinham nome diferente no Pipedrive e ficaram` : "")
      + (total.erros.length ? ` · falharam: ${total.erros.join(" · ")}` : ""));
    telaQualidade().catch(err => aviso(err.message));
  };
}
function qualKpis() {

async function qualPaginaDup(n) {
  Object.assign(QUAL, await api.get(`/api/qualidade/duplicadas?pagina=${n}`));

function qualTirarDuplicadas(fora) {
  const antes = QUAL.duplicadas.length;
  QUAL.duplicadas = QUAL.duplicadas.filter(x => !fora(x));
  QUAL.duplicadasPagina.total -= antes - QUAL.duplicadas.length;
  // a página esvaziou e ainda há duplicadas: busca a página (a última, se esta deixou de existir)
  if (!QUAL.duplicadas.length && QUAL.duplicadasPagina.total > 0) qualPaginaDup(QUAL.duplicadasPagina.pagina).catch(err => aviso(err.message));
  else qualDuplicadas();
}
/* Mescla um grupo no Pipedrive; devolve as organizações que deixaram de existir. */
/* Quem fica numa mesclagem: a sugerida pelo servidor, ou a que o master marcou no grupo. */
const qualMembros = g => [g.manter, ...g.mesclar];
const qualFica = g => (QUAL.fica || {})[g.chave] ?? g.manter.id;
async function qualMesclar(g) {
  const fica = qualFica(g), saem = qualMembros(g).filter(m => m.id !== fica).map(m => m.id);
  await api.post("/api/qualidade/mesclar", {manter_id: fica, mesclar_ids: saem});
  return saem;
}
function qualTirarMescladas(grupos, sumiram) {  // as mescladas deixam de existir: saem das sugestões também
  qualTirarDuplicadas(x => grupos.has(x));
  qualTirarSugestoes(x => sumiram.has(x.id));
  qualKpis();
}
/* Depois de excluir uma organização: sai do grupo (o grupo some se sobrar uma só) e das outras listas. */
function qualTirarOrganizacao(g, id) {
  const resto = qualMembros(g).filter(m => m.id !== id);
  if ((QUAL.fica || {})[g.chave] === id) delete QUAL.fica[g.chave];
  QUAL.sugestoes = QUAL.sugestoes.filter(x => x.id !== id);
  QUAL.suspeitas = (QUAL.suspeitas || []).filter(x => x.id !== id);
  if (resto.length < 2) qualTirarDuplicadas(x => x === g);
  else { g.manter = resto[0]; g.mesclar = resto.slice(1); qualDuplicadas(); }
  qualRazao(); qualSuspeitas(); qualKpis();
}

  el.querySelectorAll("[data-fica]").forEach(r => r.onchange = () => { (QUAL.fica ||= {})[r.dataset.fica] = +r.value; qualDuplicadas(); });

const filtroNeg = {funil: "", dono: "", q: "", pagina: 1};
let NEG_BUSCA = 0;
async function telaNegocios() {
  await carregarBase();
  const qs = new URLSearchParams({pagina: filtroNeg.pagina});
  ["funil", "dono", "q"].forEach(k => filtroNeg[k] && qs.set(k, filtroNeg[k]));
  const r = await api.get("/api/negocios?" + qs);
  if (!document.getElementById("neg-lista")) {
    document.getElementById("app").innerHTML = `
    <section style="display:grid;gap:14px">
      <div class="semana"><h1>Negócios em aberto</h1><span class="sub" id="neg-contagem"></span></div>
      <div class="filtros">
        <input id="neg-q" type="search" placeholder="Buscar empresa ou negócio" value="${esc(filtroNeg.q)}" aria-label="Buscar">
        <select id="neg-funil" aria-label="Funil"></select>
        <select id="neg-dono" aria-label="Responsável"></select>
      </div>
      <div id="neg-lista"></div>
      <p class="nota">Todos os negócios abertos no Pipedrive nos funis de Linhas Financeiras, RE, Saúde e Pipo Saúde. <b>Também em Oportunidades</b> marca a empresa que tem cross sell analisado para outra vertical.</p>
    </section>`;
    const q = document.getElementById("neg-q");
    q.oninput = () => { clearTimeout(NEG_BUSCA); NEG_BUSCA = setTimeout(() => { filtroNeg.q = q.value.trim(); filtroNeg.pagina = 1; telaNegocios(); }, 300); };
    document.getElementById("neg-funil").onchange = e => { filtroNeg.funil = e.target.value; filtroNeg.pagina = 1; telaNegocios(); };

      <ul>${itens.map(i => `<li class="${i.concluida ? "feita" : ""}">
        <input type="checkbox" data-concluir="${i.id}" ${i.concluida ? "checked" : ""} aria-label="Marcar como feita">

  </section>`;

// Chave da leitura da caixa de e-mail: só para quem já entrou; mostra o resultado da última leitura
function leitura(u) {
  if (!u.ativo) return "";
  const pode = !u.pendente;
  const estado = !pode ? '<span class="mute">disponível depois que a pessoa entrar</span>'
    : !u.leEmails ? '<span class="mute">desligada</span>'
    : u.leituraErro === "recusada" ? '<span style="color:var(--bad)">recusada pelo Microsoft 365: adicione ao grupo crosssell-equipe</span>'
    : u.leituraErro ? `<span style="color:var(--bad)" title="${esc(u.leituraErro)}">erro na última leitura</span>`
    : u.leituraEm ? `<span style="color:var(--good)">lida em ${hora(u.leituraEm)}</span>`
    : '<span class="mute">ligada, aguardando a próxima rodada</span>';
  return `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-leitura="${u.id}"${u.leEmails ? " checked" : ""}${pode ? "" : " disabled"}> ${estado}</label>`;
}

    <h1>${esc(e.nome)}</h1>
    <div class="sub">${[e.cnpj && e.cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5"), e.porte, e.setor, e.cnae, e.funcionarios && `${e.funcionarios.toLocaleString("pt-BR")} funcionários`].filter(Boolean).map(esc).join(" · ")}${inLink(e.linkedin)}
      <button type="button" class="lapis" data-func="${e.id}" data-func-atual="${e.funcionarios || ""}" data-func-nome="${esc(e.nome)}">${e.funcionarios ? "✎ funcionários" : "+ funcionários"}</button> ${btnSetor(e.id, e.setor, e.nome)}${e.setorFonte === "manual" ? ' <span class="sub">(setor informado à mão)</span>' : ""}${e.funcionariosFonte === "manual" && e.funcionariosEm ? ` <span class="sub">(informado à mão em ${dia(e.funcionariosEm)})</span>` : ""}</div>
    ${e.dominios && e.dominios.length ? `<div class="sub" title="E-mails desses domínios contam no relacionamento com a empresa">Domínios de e-mail: ${e.dominios.map(esc).join(", ")}</div>` : ""}
    <div class="sub">${e.cidade ? esc(`${e.cidade}${e.uf ? "/" + e.uf : ""}`) + (e.cidadeFonte === "manual" ? " (informada à mão)" : e.cidadeFonte ? ` (${e.cidadeFonte === "receita" ? "Receita" : e.cidadeFonte === "pipedrive" ? "Pipedrive" : "LinkedIn"})` : "") : "local não informado"}${e.praca ? ` · praça de Saúde: <b>${e.praca === "alvo" ? "alvo" : "fora"}</b>` : ""}
      <button type="button" class="lapis" data-local="${e.id}" data-local-cidade="${esc(e.cidadeFonte === "manual" ? e.cidade || "" : "")}" data-local-uf="${esc(e.uf || "")}" data-local-nome="${esc(e.nome)}">${e.cidade ? "✎ cidade" : "+ cidade"}</button></div>
    <div>${vig.length ? '<span class="tag-cli">Cliente</span>' : '<span class="tag-lead">Lead</span>'} <span class="sub">· relacionamento ${Math.round(e.score)} de 100</span></div>
    <div class="chips">${vig.length ? vig.map(n => vchip(n.vertical, n.produto + (n.fim ? ` · até ${mesAno(n.fim)}` : ""))).join("") : '<span class="sub">Nenhum seguro vigente</span>'}</div>
    ${temSaudeZeca ? "" : `<label class="check"><input type="checkbox" data-saude="${e.id}" ${vig.some(n => n.vertical === "saude") ? "checked" : ""}> Cliente Saúde${e.negocios.some(n => n.vertical === "saude" && n.status === "ganho" && !n.fim) ? " (ganho no Pipedrive; desmarque se cancelou)" : " (fora da planilha do Zeca)"}</label>`}
  </section>
  <section><h2>Oportunidades</h2><div class="tabela"><table class="larga">
    <thead><tr><th>Score</th><th>Empresa</th><th>Em negociação</th><th>Oportunidade</th><th>Por quê</th><th>Já tem conosco</th><th>Quem decide · ponte</th><th>Notícias</th><th>Próxima atividade</th></tr></thead>
    <tbody id="ops">${ops.length ? ops.map(opHTML).join("") : '<tr><td colspan="9" class="vazio">Nenhuma oportunidade: a empresa já tem ou está negociando todas as verticais.</td></tr>'}</tbody></table></div></section>
  <section><h2>Em negociação no Pipedrive</h2><div class="grupo" style="padding:12px 14px">${abertos.length ? `<div class="chips">${abertos.map(n => vchip(n.vertical, `${n.produto}${n.etapa ? " · " + n.etapa : ""}`)).join("")}</div>` : '<span class="sub">Nenhum negócio aberto.</span>'}</div></section>
  <section><h2>Pessoas</h2><div class="tabela"><table>
    <thead><tr><th>Nome</th><th>Cargo</th><th>Área</th><th>E-mail</th><th>Influência</th><th>Relação</th><th>Temperatura</th><th>Fala com</th></tr></thead>
    <tbody>${e.pessoas.map(p => `<tr><td>${p.focal ? '<span title="Ponto focal" style="color:var(--warn)">★</span> ' : ""}${esc(p.nome)}${inLink(p.linkedin)}${p.fonte === "linkedin" ? '<div class="sub">mapeado no LinkedIn</div>' : ""}${p.empresaAtual ? `<div class="sub" style="color:var(--warn)">LinkedIn: hoje em ${esc(p.empresaAtual)}</div>` : ""}</td><td>${esc(p.cargo || "")} ${btnCargo(p)}${p.headline && p.headline !== p.cargo ? `<div class="sub" style="max-width:260px">${esc(p.headline)}</div>` : ""}</td><td class="small">${esc(p.area || "")}</td><td class="small">${esc(p.email || "")}</td>
      <td><b class="num">${Math.round(p.influencia ?? 0)}</b></td><td><span class="num">${Math.round(p.score)}</span>${p.i90 ? `<div class="sub">${p.i90} e-mails em 90 dias</div>` : ""}</td><td>${celulaTemp(p)}</td>
      <td class="small">${esc((p.usuarios || []).map(nomeDe).join(", "))}</td></tr>`).join("") || '<tr><td colspan="8" class="vazio">Nenhuma pessoa cadastrada.</td></tr>'}</tbody></table></div></section>
  <section><h2>Histórico de produtos</h2><div class="tabela"><table>
    <thead><tr><th>Vertical</th><th>Produto</th><th>Situação</th><th>Vigência</th><th>Valor</th><th>Origem</th></tr></thead>
    <tbody>${e.negocios.filter(n => n.vertical).map(n => `<tr><td>${vchip(n.vertical)}</td><td>${esc(n.produto)}</td><td>${situacao(n)}</td>
      <td class="small num">${dt(n.ini)}${n.fim ? " → " + dt(n.fim) : ""}</td><td class="num">${brl(n.valor)}</td><td class="small">${esc(n.fonte)}</td></tr>`).join("") || '<tr><td colspan="6" class="vazio">Nenhum produto.</td></tr>'}</tbody></table></div></section>
  ${siteIaHTML(e.siteIa)}
  <section><h2>Notícias</h2><div class="grupo not" style="padding:12px 14px">${e.noticias.length ? e.noticias.map(noticiaHTML).join("") : '<span class="sub">Sem notícias recentes.</span>'}</div></section>`;
}

/* ---------- Eventos globais ---------- */
document.addEventListener("click", ev => {
  const o = ev.target.closest("[data-ativ-op]"); if (o && !o.disabled) abrirAtividadeOp(o.dataset.ativOp);
  const f = ev.target.closest("[data-func]"); if (f) editarFuncionarios(f.dataset.func, f.dataset.funcAtual, f.dataset.funcNome);
  const rl = ev.target.closest("[data-rolar]"); if (rl) { ev.preventDefault(); document.getElementById(rl.dataset.rolar)?.scrollIntoView({behavior: "smooth", block: "start"}); }
  const l = ev.target.closest("[data-local]"); if (l) editarLocal(l.dataset.local, l.dataset.localCidade, l.dataset.localUf, l.dataset.localNome);
  const st = ev.target.closest("[data-setor]"); if (st) editarSetor(st.dataset.setor, st.dataset.setorAtual, st.dataset.setorNome);
  const cg = ev.target.closest("[data-cargo]"); if (cg) editarCargo(cg.dataset.cargo, cg.dataset.cargoAtual, cg.dataset.cargoNome);
});
document.addEventListener("change", async ev => {
  const s = ev.target.dataset?.saude, c = ev.target.dataset?.concluir;
  try {
    if (s) { await api.post(`/api/empresas/${s}/saude`, {cliente: ev.target.checked}); aviso(ev.target.checked ? "Marcada como cliente Saúde" : "Desmarcada: não é mais cliente Saúde");
      OPS_RESP = null; render(); }
    if (c) { await api.post(`/api/atividades/${c}/concluir`, {concluida: ev.target.checked}); telaTodos(); }
  } catch (err) { aviso(err.message); ev.target.checked = !ev.target.checked; }
});

async function render() {
  const h = location.hash || "#oportunidades";
  const m = h.match(/^#empresa-(\d+)$/);
  VEZ++;
  abas(m ? "oportunidades" : h.slice(1));
  document.getElementById("app").innerHTML = '<p class="vazio">Carregando…</p>';  // a aba muda já no clique
  try {
    if (m) await telaEmpresa(m[1]);
    else if (h === "#todos") await telaTodos();
    else if (h === "#negocios") await telaNegocios();
    else if (h === "#qualidade") await telaQualidade();
    else if (h === "#melhorias") await telaMelhorias();
    else if (h === "#rotina") await telaRotina();
    else if (h === "#equipe") await telaEquipe();
    else await telaOportunidades();
  } catch (err) { if (err.message !== "login" && err.message !== OBSOLETA) document.getElementById("app").innerHTML = `<p class="vazio">${esc(err.message)}</p>`; }
}

(async () => {
  document.getElementById("demo").hidden = !PREVIA;
  document.getElementById("sair").hidden = PREVIA;
  try { EU = await api.get("/api/eu"); } catch (e) { return; }
  document.getElementById("eu").textContent = EU.nome;
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
</body>
</html>
