<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innoa Cross Sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: barra com abas + coluna de 1320px; a tabela de negócios é a tela principal, rolagem horizontal própria */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#15202b; --mute:#5c6b7a; --line:#dde3ea; --soft:#eef2f6;
  --accent:#0b5c72; --accent-ink:#ffffff; --warn:#a15c00; --good:#1d7a46; --bad:#b42318;
  --lf:#5b45c4; --saude:#12805c; --re:#b86a00; --canal:#4a5a6a;
  --quente:#c2410c; --morna:#a16207; --fria:#2563eb;
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#161e26; --ink:#e3e9ef; --mute:#93a3b3; --line:#283340; --soft:#1c2630;
  --accent:#4fb3cc; --accent-ink:#06222b; --warn:#e3a14a; --good:#5cc78d; --bad:#f97066;
  --lf:#9a88f0; --saude:#4cc59a; --re:#e6a243; --canal:#9aabbd;
  --quente:#fb923c; --morna:#facc15; --fria:#60a5fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#161e26; --ink:#e3e9ef; --mute:#93a3b3; --line:#283340; --soft:#1c2630;
  --accent:#4fb3cc; --accent-ink:#06222b; --warn:#e3a14a; --good:#5cc78d; --bad:#f97066;
  --lf:#9a88f0; --saude:#4cc59a; --re:#e6a243; --canal:#9aabbd;
  --quente:#fb923c; --morna:#facc15; --fria:#60a5fa; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1320px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-height:52px}
.brand{font:800 17px/1 var(--f-display);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--accent)}
nav.abas{display:flex;gap:2px;align-self:stretch}
nav.abas a{display:flex;align-items:center;padding:0 12px;color:var(--mute);text-decoration:none;font-weight:500;border-bottom:2px solid transparent}
nav.abas a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.top .dir{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--mute)}
.pill-demo{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--warn);border:1px solid var(--line)}
main{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:grid;gap:18px}
h1{font:700 21px/1.2 var(--f-display);margin:0;text-wrap:balance}
h2{font:700 15px/1.2 var(--f-display);margin:0 0 10px}
.mute{color:var(--mute)} .small{font-size:12px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:500;padding:1px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.chip.solid{background:var(--c);color:var(--surface);border-color:var(--c)}
.chip.off{--c:var(--mute);border-style:dashed;background:transparent}
.c-linhas_financeiras{--c:var(--lf)} .c-saude{--c:var(--saude)} .c-ramos_elementares{--c:var(--re)} .c-null,.c-canal{--c:var(--canal)}
.t-muita{--c:var(--quente)} .t-media{--c:var(--morna)} .t-pouca{--c:var(--fria)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.chip{cursor:pointer;font:inherit;font-size:12px}
button.chip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
select,input,textarea{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input[type=search]{min-width:0;flex:1 1 200px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.btn{font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.sec{background:transparent;color:var(--accent)}
.btn.perigo{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tabela{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
table.larga{min-width:1500px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;background:var(--soft);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.score{display:grid;gap:4px;min-width:96px}
.score b{font:600 16px/1 var(--f-data)}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.comp{font-size:11px;color:var(--mute);font-family:var(--f-data);white-space:nowrap}
ul.lista{margin:0;padding-left:16px;display:grid;gap:2px;font-size:13px}
.sub{font-size:12px;color:var(--mute)}
.tag-cli{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--good)}
.tag-lead{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.vig{display:grid;gap:4px;min-width:170px}
.check{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);cursor:pointer}
.not a,.not span:not(.sub){display:block;font-size:12px;line-height:1.35;text-decoration:none}
.not a:hover{text-decoration:underline}
.not .sub{margin-bottom:6px}
.rel{font-size:12px;display:grid;gap:2px;min-width:140px}
.prox{font-size:12px;display:grid;gap:6px;min-width:160px}
.decide{font-size:12px;display:grid;gap:3px;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line, #ddd)}
.decide .ponte{margin-top:2px}
.decide.solo{margin-top:0;padding-top:0;border-top:0}
ul.motivos{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
ul.motivos li{display:grid;grid-template-columns:16px 1fr;gap:4px;align-items:baseline}
.sinal{font:700 12px/1 var(--f-data);text-align:center}
.mais,.mais .sinal{color:var(--good)} .menos .sinal,.menos{color:var(--bad)} .falta .sinal,.falta{color:var(--mute)} .alerta .sinal,.alerta{color:var(--warn)}
ul.motivos li.mais,ul.motivos li.menos,ul.motivos li.alerta{color:var(--ink)}
ul.motivos li.falta{color:var(--mute)}
.vazio{padding:24px;text-align:center;color:var(--mute)}
.nota{font-size:12px;color:var(--mute);margin:0}
.kpi-row{display:flex;gap:12px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid}
.kpi b{font:700 22px/1.1 var(--f-display)}
.kpi span{font-size:12px;color:var(--mute)}
.grupo{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.grupo h3{font:700 14px/1.2 var(--f-display);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grupo ul{list-style:none;margin:0;padding:0}
.grupo li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.grupo li:last-child{border-bottom:0}
.grupo li.feita .ass{text-decoration:line-through;color:var(--mute)}
.atrasada{color:var(--bad);font-weight:600}
.semana{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal-fundo{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;width:100%;max-width:460px;display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.modal .acoes{display:flex;gap:8px;justify-content:flex-end}
.erro{color:var(--bad);font-size:13px;margin:0}
.aviso{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30}
.form-linha{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form-linha label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
fieldset label{display:flex;gap:4px;align-items:center}
.link-convite{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:6px;padding:8px 10px;font-size:12px}
.link-convite code{font-family:var(--f-data);word-break:break-all;flex:1 1 260px;min-width:0}
.ficha-head{display:grid;gap:8px}
a.in{display:inline-block;font:600 10px/1 var(--f-body);padding:2px 4px;border-radius:3px;background:var(--accent);color:var(--accent-ink);text-decoration:none;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#negocios">Innoa <span>Cross Sell</span></a>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <div class="dir"><span class="pill-demo" id="demo" hidden>Prévia com dados de exemplo · nada é enviado ao Pipedrive</span><span id="eu"></span><a href="/logout" id="sair">Sair</a></div>
</div></header>
<main id="app"><p class="vazio">Carregando…</p></main>
<div id="modal"></div>
<div class="aviso" id="aviso" hidden></div>

<script>
const D = /*__DADOS__*/null;
const PREVIA = !!D;
const TIPOS = {task:"Tarefa", call:"Ligação", meeting:"Reunião", email:"E-mail"};
const TEMP = {muita:"Muita abertura", media:"Média abertura", pouca:"Pouca abertura"};
let V = {}, EU = null, USUARIOS = [], LINHAS = [], OPS = [];
const filtro = {funil:"", dono:"", temp:"", tipo:"", q:""};
const filtroOp = {vertical:"", q:"", tipo:""};
let refSemana = new Date();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt = d => d ? d.slice(0,10).split("-").reverse().join("/") : "";
const dm = d => d ? dt(d).slice(0,5) : "";
const mesAno = d => d ? `${d.slice(5,7)}/${d.slice(2,4)}` : "";
const iso = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const brl = v => v == null ? "" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL", maximumFractionDigits:0});
const nomeDe = email => (USUARIOS.find(u => u.email === email) || {}).nome || email || "";
const vchip = (v, txt, extra="") => `<span class="chip c-${v || "null"} ${extra}">${esc(txt ?? V[v] ?? "Sem vertical")}</span>`;
const inLink = url => url ? ` <a class="in" href="${esc(url)}" target="_blank" rel="noopener" title="Perfil no LinkedIn">in</a>` : "";
function aviso(msg){ const a = document.getElementById("aviso"); a.textContent = msg; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.hidden = true, 3500); }

/* ---------- Camada de dados: servidor real ou prévia embutida ---------- */
const api = {
  async get(path) {
    if (PREVIA) return previa.get(path);
    const r = await fetch(path, {credentials:"same-origin"});
    if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Não foi possível carregar.");
    return r.json();
  },
  async post(path, body) {
    if (PREVIA) return previa.post(path, body);
    const r = await fetch(path, {method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json", "X-Cross-Sell":"1"}, body: JSON.stringify(body || {})});
    if (r.status === 401) { location.href = "/login"; throw new Error("login"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "A operação falhou.");
    return j;
  },
};

const previa = {
  seq: 1000,
  get(path) {
    if (path === "/api/eu") return D.eu;
    if (path === "/api/tabela") return {linhas: D.linhas, usuarios: D.equipe.filter(u => u.ativo), verticais: D.verticais};
    if (path === "/api/equipe") return D.equipe;
    if (path === "/api/linkedin") return D.linkedin;
    if (path === "/api/oportunidades") return {itens: D.oportunidades || []};
    if (path === "/api/qualidade") return D.qualidade || {duplicadas: [], sugestoes: [], semCnpj: 0, aguardandoReceita: 0};
    let m = path.match(/^\/api\/empresas\/(\d+)/); if (m) return D.empresas[m[1]];
    m = path.match(/^\/api\/todos\?ref=(.+)$/); if (m) return todosLocal(m[1]);
    throw new Error("rota desconhecida");
  },
  post(path, b) {
    let m;
    if (path === "/api/atividades") {
      const l = b.negocio_id ? D.linhas.find(x => x.id === b.negocio_id) : (D.oportunidades || []).find(o => o.empresa.id === b.empresa_id);
      const resp = D.equipe.find(u => u.id === b.responsavel_id);
      const p = l.contatos.find(c => c.id === b.pessoa_id);
      const at = {id: ++this.seq, assunto: b.assunto, tipo: b.tipo, vencimento: b.vencimento, concluida: false,
        responsavel: resp.email, responsavelNome: resp.nome, empresa: l.empresa?.nome, empresaId: l.empresa?.id,
        pessoa: p?.nome, negocio: b.negocio_id ? l.titulo : null, negocioId: b.negocio_id || null};
      D.atividades.push(at);
      if (!l.proximaAtividade || b.vencimento < l.proximaAtividade.vencimento) l.proximaAtividade = {assunto: b.assunto, vencimento: b.vencimento, responsavel: resp.email};
      return {id: at.id};
    }
    if ((m = path.match(/^\/api\/atividades\/(\d+)\/concluir$/))) { const a = D.atividades.find(x => x.id == m[1]); a.concluida = b.concluida; return {ok:true}; }
    if ((m = path.match(/^\/api\/empresas\/(\d+)\/saude$/))) {
      D.linhas.filter(l => l.empresa?.id == m[1]).forEach(l => {
        l.saude.manual = b.cliente; l.saude.desmarcado = !b.cliente;
        if (l.saude.pipedrive) { l._vit = l._vit || l.vigentes.filter(v => v.vitalicio); l.vigentes = l.vigentes.filter(v => !v.vitalicio && v.fonte !== "manual"); if (b.cliente) l.vigentes.push(...l._vit); return; }
        l.vigentes = l.vigentes.filter(v => v.fonte !== "manual");
        if (b.cliente) l.vigentes.push({vertical:"saude", produto:"Saúde", fim:null, fonte:"manual"});
      });
      return {ok:true};
    }
    if (path === "/api/linkedin/disparar") {
      const L = D.linkedin, n = Math.min(L.lote, L.ler.empresas + L.ler.pessoas + L.buscar.empresas + L.buscar.pessoas + (L.areas || 0));
      L.disparado = {em: new Date().toISOString(), registros: n}; L.ultimas24h = (L.ultimas24h || 0) + n;
      L.ler = {empresas: 0, pessoas: 0}; L.buscar = {empresas: 0, pessoas: 0}; L.areas = 0; return {iniciados: n, aplicados: 0};
    }
    if (path === "/api/qualidade/mesclar") { D.qualidade.duplicadas = D.qualidade.duplicadas.filter(g => g.manter.id !== b.manter_id); return {mescladas: b.mesclar_ids.length}; }
    if (path === "/api/qualidade/razao") { D.qualidade.sugestoes = D.qualidade.sugestoes.filter(x => x.id !== b.empresa_id); return {ok: true}; }
    if (path === "/api/qualidade/ignorar") { D.qualidade.duplicadas = D.qualidade.duplicadas.filter(g => g.chave !== b.chave); D.qualidade.sugestoes = D.qualidade.sugestoes.filter(x => x.chave !== b.chave); return {ok: true}; }
    if (path === "/api/linkedin/endereco") { D.linkedin.naoEncontrados = D.linkedin.naoEncontrados.filter(x => x.id_alvo !== b.id_alvo); return {ok: true}; }
    if (path === "/api/equipe/convidar") {
      const u = {id: ++this.seq, email: b.email.toLowerCase(), nome: b.nome, papel:"membro", ativo:true, verticais:b.verticais, lider:b.lider, pipedrive:false, pendente:true};
      D.equipe.push(u); return {usuario:u, link:"https://(endereço da plataforma)/convite/exemplo-" + u.id};
    }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/desconvidar$/))) { const u = D.equipe.find(x => x.id == m[1]); u.ativo = false; return u; }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/nova-senha$/))) { const u = D.equipe.find(x => x.id == m[1]); return {usuario:u, link:"https://(endereço da plataforma)/redefinir/exemplo-" + u.id}; }
    if ((m = path.match(/^\/api\/equipe\/(\d+)\/reenviar$/))) { const u = D.equipe.find(x => x.id == m[1]); u.ativo = true; return {usuario:u, link:"https://(endereço da plataforma)/convite/exemplo-" + u.id}; }
    throw new Error("rota desconhecida");
  },
};

function semanaDe(ref) {
  const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const seg = new Date(d); seg.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const sex = new Date(seg); sex.setDate(seg.getDate() + 4);
  return [seg, sex];
}
function todosLocal(refIso) {
  const ref = new Date(refIso + "T12:00:00"), [seg, sex] = semanaDe(ref), hoje = iso(new Date());
  const ini = iso(seg), fim = iso(sex);
  const itens = D.atividades.filter(a => (!a.concluida && a.vencimento <= fim) || (a.concluida && a.vencimento >= ini && a.vencimento <= fim))
    .map(a => ({...a, atrasada: !a.concluida && a.vencimento < hoje})).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  return {inicio: ini, fim, itens};
}

/* ---------- Abas ---------- */
function abas(ativa) {
  const itens = [["negocios","Negócios"],["oportunidades","Oportunidades"],["todos","To-dos da semana"]];
  if (EU?.papel === "master") itens.push(["qualidade","Qualidade"], ["equipe","Equipe"]);
  document.getElementById("abas").innerHTML = itens.map(([k, t]) => `<a href="#${k}" ${ativa === k ? 'aria-current="page"' : ""}>${t}</a>`).join("");
}

/* ---------- Negócios ---------- */
function celulaVigentes(l) {
  const chips = l.vigentes.length
    ? `<div class="chips">${l.vigentes.map(v => vchip(v.vertical, v.produto + (v.fim ? ` · até ${mesAno(v.fim)}`
        : v.vitalicio ? (v.ganhoEm ? ` · desde ${mesAno(v.ganhoEm)}` : "") + (l.saude.manual ? "" : " · a confirmar")
        : v.fonte === "manual" ? " · marcado" : ""))).join("")}</div>`
    : `<span class="sub">Nenhum seguro vigente</span>`;
  const s = l.saude;
  const saude = !l.empresa || s.zeca ? ""
    : s.pipedrive ? `<label class="check" title="Saúde não tem fim de vigência: vale até alguém desmarcar"><input type="checkbox" data-saude="${l.empresa.id}" ${s.desmarcado ? "" : "checked"}> Ainda é cliente Saúde${s.pipedrive !== "sem data" ? ` (ganho em ${mesAno(s.pipedrive)})` : ""}</label>`
    : `<label class="check"><input type="checkbox" data-saude="${l.empresa.id}" ${s.manual ? "checked" : ""}> Cliente Saúde (fora da planilha)</label>`;
  return `<div class="vig">${chips}${saude}</div>`;
}
function celulaTemp(p) {
  if (!p) return `<span class="sub">sem contato</span>`;
  if (!p.temperatura) return `<span class="sub">sem e-mails do contato</span>`;

}
function celulaDecide(d, vertical, solo = false) {
  if (!d) return "";

  const nomeV = V[vertical] || "";
  const rot = solo ? "" : `<span class="mute">Quem decide ${esc(nomeV)}:</span> `;
  if (!d.daArea && !d.pessoas.length) return `<div class="${cls}">${rot}<span class="sub">ainda não sabemos (${esc(d.areas.join(" / "))})</span></div>`;
  const pessoa = x => `<div>${esc(x.nome)}${inLink(x.linkedin)} <span class="sub" title="Score de Influência">· infl. ${Math.round(x.influencia ?? 0)}</span><div class="sub">${esc(x.cargo || "")}${x.relacao >= 20 ? ` · fala com ${esc(x.quemFala || "a equipe")}` : " · sem relação"}</div></div>`;

}
const NOME_CRIT = {influencia:"Influência", funcionarios:"Funcionários", qualificacao:"Qualificação do time", localizacao:"Localização", rh:"RH estruturado", produto:"Encaixe do produto", perfil:"Perfil (galpão/indústria)", porte:"Porte"};
function celulaScore(x) {
  const det = (x.criterios || []).map(c => `${NOME_CRIT[c.nome] || c.nome}: ${Math.round(c.valor * 100)} (peso ${c.peso})`).join("\n");
  return `<div class="score" title="${esc(det)}"><b>${x.score.toFixed(0)}</b><div class="bar"><i style="width:${x.score}%"></i></div>
    <span class="comp">Influência ${Math.round(x.influencia ?? 0)}</span></div>`;
}
const SINAL = {"+": ["mais", "A favor"], "-": ["menos", "Contra"], "?": ["falta", "Falta informação"], "!": ["alerta", "Atenção"]};
function listaMotivos(ms) {

}

      ${l.pessoa ? `<div class="sub">${l.pessoa.doNegocio === false ? '<span class="mute">contato mais influente: </span>' : ""}${esc(l.pessoa.nome)}${l.pessoa.cargo ? " · " + esc(l.pessoa.cargo) : ""}${inLink(l.pessoa.linkedin)}</div>${l.pessoa.headline ? `<div class="sub" style="max-width:220px">${esc(l.pessoa.headline)}</div>` : ""}` : ""}</td>

    <td><div class="prox">${prox ? `<span>${esc(prox.assunto)}<br><span class="sub">${dm(prox.vencimento)} · ${esc(nomeDe(prox.responsavel))}</span></span>` : '<span class="sub">Nenhuma atividade aberta</span>'}
      <button class="btn sec" data-ativ="${l.id}" ${l.contatos.length ? "" : 'disabled title="Nenhum contato desta empresa está no Pipedrive"'}>Criar atividade</button></div></td>
  </tr>`;

function proximaSexta() { const d = new Date(); d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7 || 7)); return iso(d); }
function abrirAtividade(id) {
  const l = LINHAS.find(x => x.id == id);

}
function abrirAtividadeOp(id) {
  const o = OPS.find(x => x.id === id);
  const ponte = o.quemDecide?.ponte, alvo = o.quemDecide?.pessoas?.[0];
  const pref = [ponte, alvo].find(x => x && x.noPipedrive);
  const quem = alvo ? ` (${alvo.nome})` : "";

}

  const l = {contatos: ctx.contatos};
  const dono = USUARIOS.find(u => u.email === ctx.donoEmail) || USUARIOS.find(u => u.email === EU.email) || USUARIOS[0];
  const pessoaPadrao = l.contatos.find(c => c.id === ctx.pessoaId) || l.contatos[0];

    <div class="form-linha">

    </div>
    <label>Quem executa<select id="a-resp">${USUARIOS.map(u => `<option value="${u.id}" ${u.id === dono?.id ? "selected" : ""} ${u.pipedrive || PREVIA ? "" : "disabled"}>${esc(u.nome)}${u.pipedrive || PREVIA ? "" : " (sem usuário no Pipedrive)"}</option>`).join("")}</select></label>
    <label>Nota (opcional)<textarea id="a-nota" rows="3"></textarea></label>
    <p class="erro" id="a-erro" hidden></p>
    <div class="acoes"><button type="button" class="btn sec" id="a-cancelar">Cancelar</button><button class="btn" id="a-salvar">Criar atividade</button></div>
  </form></div>`;
  const fechar = () => document.getElementById("modal").innerHTML = "";
  document.getElementById("a-cancelar").onclick = fechar;
  document.getElementById("fundo").onclick = e => { if (e.target.id === "fundo") fechar(); };

      await api.post("/api/atividades", {...ctx.corpo, pessoa_id: +document.getElementById("a-pessoa").value || null,
        assunto: document.getElementById("a-assunto").value, tipo: document.getElementById("a-tipo").value,

        nota: document.getElementById("a-nota").value || null});

        <td><input id="rz-${x.id}" value="${esc(x.sugerida)}" style="width:100%;min-width:300px"></td><td class="num">${x.negocios}</td>
        <td style="white-space:nowrap"><button class="btn" data-razao="${x.id}">Atualizar no Pipedrive</button> <button class="btn sec" data-ignorar="${esc(x.chave)}">Manter como está</button></td></tr>`).join("")}
      </tbody></table></div>${q.sugestoes.length > 200 ? `<p class="nota" style="padding:8px 14px">Mostrando 200 de ${q.sugestoes.length}, as com mais negócios primeiro.</p>` : ""}` : '<p class="vazio">Nenhuma sugestão por enquanto.</p>'}</div>
  </section>`;
  document.querySelectorAll("[data-mesclar]").forEach(b => b.onclick = async () => {
    const g = q.duplicadas.find(x => x.chave === b.dataset.mesclar);
    if (b.dataset.confirmar !== "1") { b.dataset.confirmar = "1"; b.textContent = "Confirmar: não tem volta"; return; }
    b.disabled = true;
    try { await api.post("/api/qualidade/mesclar", {manter_id: g.manter.id, mesclar_ids: g.mesclar.map(m => m.id)}); aviso(PREVIA ? "Mesclada na prévia (nada foi enviado)" : "Organizações mescladas no Pipedrive"); telaQualidade(); }
    catch (err) { aviso(err.message); b.disabled = false; }
  });
  document.querySelectorAll("[data-razao]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api.post("/api/qualidade/razao", {empresa_id: +b.dataset.razao, nome: document.getElementById("rz-" + b.dataset.razao).value}); aviso(PREVIA ? "Atualizada na prévia (nada foi enviado)" : "Nome atualizado no Pipedrive"); telaQualidade(); }
    catch (err) { aviso(err.message); b.disabled = false; }
  });
  document.querySelectorAll("[data-ignorar]").forEach(b => b.onclick = async () => { await api.post("/api/qualidade/ignorar", {chave: b.dataset.ignorar}); telaQualidade(); });
}

/* ---------- To-dos da semana ---------- */
async function telaTodos() {
  if (!USUARIOS.length) { const t = await api.get("/api/tabela"); USUARIOS = t.usuarios; V = t.verticais; LINHAS = t.linhas; }
  const r = await api.get("/api/todos?ref=" + iso(refSemana));
  const grupos = {};
  r.itens.forEach(i => (grupos[i.responsavel] ||= []).push(i));
  const total = r.itens.length, feitas = r.itens.filter(i => i.concluida).length, atras = r.itens.filter(i => i.atrasada).length;
  document.getElementById("app").innerHTML = `
  <section style="display:grid;gap:14px">
    <div class="semana">
      <button class="btn sec" id="s-ant">← Semana anterior</button>
      <button class="btn sec" id="s-hoje">Esta semana</button>
      <button class="btn sec" id="s-prox">Próxima semana →</button>
      <h1 style="margin-left:8px">Semana de ${dm(r.inicio)} a ${dm(r.fim)}</h1>
      <span class="sub">reunião na sexta, ${dt(r.fim)}</span>
    </div>
    <div class="kpi-row">
      <div class="kpi"><b class="num">${total - feitas}</b><span>pendentes até sexta</span></div>
      <div class="kpi"><b class="num" style="color:var(--bad)">${atras}</b><span>atrasadas</span></div>
      <div class="kpi"><b class="num" style="color:var(--good)">${feitas}</b><span>feitas na semana</span></div>
    </div>
    ${Object.keys(grupos).length ? Object.entries(grupos).sort((a, b) => nomeDe(a[0]).localeCompare(nomeDe(b[0]))).map(([resp, itens]) => `
      <div class="grupo"><h3>${esc(itens[0].responsavelNome || nomeDe(resp))}<span class="sub">${itens.filter(i => !i.concluida).length} pendentes · ${itens.filter(i => i.concluida).length} feitas</span></h3>
      <ul>${itens.map(i => `<li class="${i.concluida ? "feita" : ""}">
        <input type="checkbox" data-concluir="${i.id}" ${i.concluida ? "checked" : ""} aria-label="Marcar como feita">
        <div><div class="ass">${esc(i.assunto)}</div><div class="sub">${TIPOS[i.tipo] || ""}${i.empresa ? ` · <a href="#empresa-${i.empresaId}">${esc(i.empresa)}</a>` : ""}${i.pessoa ? " · " + esc(i.pessoa) : ""}${i.negocio ? " · " + esc(i.negocio) : ""}</div></div>
        <span class="small num ${i.atrasada ? "atrasada" : "mute"}">${i.atrasada ? "atrasada · " : ""}${dm(i.vencimento)}</span></li>`).join("")}</ul></div>`).join("")
      : `<div class="grupo"><p class="vazio">Nenhuma atividade para esta semana. Crie atividades na aba Negócios.</p></div>`}
    <p class="nota">Lista as atividades criadas pela plataforma: pendentes com vencimento até sexta (inclusive atrasadas) e as feitas na semana. Marcar como feita atualiza o Pipedrive.</p>
  </section>`;
  const mover = dias => { refSemana = new Date(refSemana); refSemana.setDate(refSemana.getDate() + dias); telaTodos(); };
  document.getElementById("s-ant").onclick = () => mover(-7);
  document.getElementById("s-prox").onclick = () => mover(7);
  document.getElementById("s-hoje").onclick = () => { refSemana = new Date(); telaTodos(); };
}

/* ---------- Equipe ---------- */
async function telaEquipe() {
  if (EU?.papel !== "master") { location.hash = "#negocios"; return; }
  if (!Object.keys(V).length) { const t = await api.get("/api/tabela"); USUARIOS = t.usuarios; V = t.verticais; LINHAS = t.linhas; }
  const equipe = await api.get("/api/equipe");
  const vs = Object.entries(V);
  document.getElementById("app").innerHTML = `
  <section style="display:grid;gap:14px">
    <h1>Equipe</h1>
    <form class="grupo" id="f-conv" style="padding:14px;display:grid;gap:10px">
      <h2 style="margin:0">Convidar pessoa</h2>
      <div class="form-linha">
        <label>Nome<input id="c-nome" required></label>
        <label>E-mail<input id="c-email" type="email" required placeholder="nome@innoaseguros.com.br"></label>
        <fieldset><legend>Atua em</legend>${vs.map(([k, t]) => `<label><input type="checkbox" name="c-vert" value="${k}"> ${t}</label>`).join("")}</fieldset>
        <fieldset><legend>Lidera</legend>${vs.map(([k, t]) => `<label><input type="checkbox" name="c-lider" value="${k}"> ${t}</label>`).join("")}</fieldset>
        <button class="btn">Gerar convite</button>
      </div>
      <p class="nota">A pessoa recebe um link para criar a senha (vale 7 dias). Enquanto o acesso estiver ativo, os e-mails dela com clientes são lidos pela IA.</p>
      <div id="c-link"></div>
    </form>
    <div class="grupo" id="lk" style="padding:14px;display:grid;gap:10px"></div>
    <div class="tabela"><table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Verticais</th><th>Situação</th><th>Pipedrive</th><th></th></tr></thead>
      <tbody>${equipe.map(u => `<tr>
        <td>${esc(u.nome)}${u.papel === "master" ? ' <span class="sub">· master</span>' : ""}</td><td class="small">${esc(u.email)}</td>
        <td><div class="chips">${u.verticais.map(v => vchip(v, V[v] + (u.lider.includes(v) ? " · líder" : ""))).join("") || '<span class="sub">—</span>'}</div></td>
        <td class="small">${!u.ativo ? '<span class="mute">Acesso removido</span>' : u.pendente ? '<span style="color:var(--warn)">Convite pendente</span>' : '<span style="color:var(--good)">Ativo · e-mails lidos</span>'}</td>
        <td class="small">${u.pipedrive ? "vinculado" : '<span class="mute">não vinculado</span>'}</td>
        <td style="white-space:nowrap">${u.papel === "master" ? "" : u.ativo
          ? `${u.pendente ? `<button class="btn sec" data-reenviar="${u.id}">Novo link</button> ` : `<button class="btn sec" data-novasenha="${u.id}">Link de nova senha</button> `}<button class="btn perigo" data-remover="${u.id}">Remover acesso</button>`
          : `<button class="btn sec" data-reenviar="${u.id}">Convidar de novo</button>`}</td></tr>`).join("")}</tbody></table></div>
  </section>`;
  telaLinkedin();
  const mostrarLink = (link, nome, rotulo = "Link de convite") => {
    document.getElementById("c-link").innerHTML = `<div class="link-convite"><span>${esc(rotulo)} para ${esc(nome)}:</span><code id="c-url">${esc(link)}</code><button type="button" class="btn sec" id="c-copiar">Copiar</button></div>`;
    document.getElementById("c-copiar").onclick = () => navigator.clipboard?.writeText(link).then(() => aviso("Link copiado"), () => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("c-url")); getSelection().removeAllRanges(); getSelection().addRange(r); aviso("Selecione e copie o link");
    });
  };
  document.getElementById("f-conv").onsubmit = async e => {
    e.preventDefault();
    const marcados = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    try {
      const r = await api.post("/api/equipe/convidar", {nome: document.getElementById("c-nome").value, email: document.getElementById("c-email").value, verticais: marcados("c-vert"), lider: marcados("c-lider")});
      await telaEquipe(); mostrarLink(r.link, r.usuario.nome);
    } catch (err) { aviso(err.message); }
  };
  document.querySelectorAll("[data-reenviar]").forEach(b => b.onclick = async () => { const r = await api.post(`/api/equipe/${b.dataset.reenviar}/reenviar`); await telaEquipe(); mostrarLink(r.link, r.usuario.nome); });
  document.querySelectorAll("[data-novasenha]").forEach(b => b.onclick = async () => {
    try { const r = await api.post(`/api/equipe/${b.dataset.novasenha}/nova-senha`); mostrarLink(r.link, r.usuario.nome, "Link de nova senha (vale 1 hora)"); }
    catch (err) { aviso(err.message); } });
  document.querySelectorAll("[data-remover]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirmar !== "1") { b.dataset.confirmar = "1"; b.textContent = "Confirmar remoção"; return; }
    await api.post(`/api/equipe/${b.dataset.remover}/desconvidar`); aviso("Acesso removido. Os e-mails dessa pessoa deixam de ser lidos."); telaEquipe();
  });
}

async function telaLinkedin() {
  const el = document.getElementById("lk");
  const st = await api.get("/api/linkedin");
  const quando = x => x ? `${dt(x.em)} ${x.em.slice(11, 16)} · ${x.registros} itens${x.erro ? " · com erro" : ""}` : "nunca";
  const nao = st.naoEncontrados || [];
  el.innerHTML = `<h2 style="margin:0">LinkedIn</h2>
    <p class="nota">Automático, pela Linked API. A cada hora a plataforma aplica as consultas que ficaram prontas e inicia até ${st.lote} novas, sem passar de ${st.limiteDia ?? 50} em 24 horas, na ordem da tabela (maior score primeiro) e depois das Oportunidades. Quem já tem endereço é <b>lido</b> (página da empresa com decisores e posts); quem não tem é <b>buscado</b> pelo nome, e a plataforma só aceita se o nome e a empresa conferirem. Quando falta alguém da área que decide (RH para Saúde, por exemplo), ela procura os <b>funcionários dessa área</b> na página da empresa.</p>
    ${st.configurado ? "" : '<p class="erro">Integração não configurada: defina LINKED_API_TOKEN e LINKED_API_IDENTIFICATION_TOKEN no servidor.</p>'}
    <div class="kpi-row">
      <div class="kpi"><b class="num">${st.ler.empresas + st.ler.pessoas}</b><span>para ler (${st.ler.empresas} empresas · ${st.ler.pessoas} pessoas)</span></div>
      <div class="kpi"><b class="num">${st.buscar.empresas + st.buscar.pessoas}</b><span>para buscar (${st.buscar.empresas} empresas · ${st.buscar.pessoas} pessoas)</span></div>
      <div class="kpi"><b class="num">${st.areas ?? 0}</b><span>áreas a procurar (quem decide)</span></div>
      <div class="kpi"><b class="num" style="color:${nao.length ? "var(--warn)" : "inherit"}">${nao.length}</b><span>não encontrados</span></div>
      <div class="kpi"><b class="num">${st.ultimas24h ?? 0}<span class="sub"> / ${st.limiteDia ?? 50}</span></b><span>consultas nas últimas 24 h</span></div>
    </div>
    <div class="form-linha"><button type="button" class="btn sec" id="lk-disp" ${st.configurado ? "" : "disabled"}>Rodar agora</button></div>
    <p class="nota">Última rodada: ${quando(st.disparado)}</p>
    ${nao.length ? `<details><summary class="small" style="cursor:pointer">Ver não encontrados e informar o endereço à mão</summary>
      <div class="tabela" style="margin-top:8px"><table><thead><tr><th>Quem</th><th>Empresa</th><th>Endereço do LinkedIn</th><th></th></tr></thead><tbody>
      ${nao.map(n => `<tr><td>${esc(n.nome)} <span class="sub">· ${n.tipo}</span></td><td class="small">${esc(n.empresa)}</td>
        <td><input id="url-${n.id_alvo}" placeholder="https://www.linkedin.com/${n.tipo === "pessoa" ? "in" : "company"}/..." style="width:100%;min-width:240px"></td>
        <td><button type="button" class="btn sec" data-url="${n.id_alvo}">Salvar</button></td></tr>`).join("")}
      </tbody></table></div></details>` : ""}`;
  document.getElementById("lk-disp").onclick = async () => {
    try { const r = await api.post("/api/linkedin/disparar");
      const n = r.iniciados ?? r.enviados ?? 0;
      aviso(r.limite ? "Limite de 24 h atingido; continua na próxima rodada" : n || r.aplicados ? `${n} consultas iniciadas · ${r.aplicados || 0} resultados aplicados` : "Nada na fila"); telaLinkedin(); }
    catch (err) { aviso(err.message); }
  };
  el.querySelectorAll("[data-url]").forEach(b => b.onclick = async () => {
    try { await api.post("/api/linkedin/endereco", {id_alvo: b.dataset.url, url: document.getElementById("url-" + b.dataset.url).value});
      aviso("Endereço salvo; entra na próxima leitura"); telaLinkedin(); } catch (err) { aviso(err.message); }
  });
}

/* ---------- Ficha da empresa ---------- */
async function telaEmpresa(id) {
  if (!USUARIOS.length) { const t = await api.get("/api/tabela"); USUARIOS = t.usuarios; V = t.verticais; LINHAS = t.linhas; }
  const e = await api.get("/api/empresas/" + id);
  const vig = e.negocios.filter(n => n.vigente), abertos = LINHAS.filter(l => l.empresa?.id == id);
  const temSaudeZeca = vig.some(n => n.vertical === "saude" && n.fonte === "zeca"), saudeManual = vig.some(n => n.vertical === "saude" && n.fonte === "manual");
  const situacao = n => n.vigente ? "Vigente" : n.status === "aberto" ? "Em negociação" : n.status === "cancelado" ? "Cancelado" : n.status === "perdido" ? "Perdido" : n.fim ? "Vencido" : "Ganho sem fim de vigência";
  document.getElementById("app").innerHTML = `
  <a href="#negocios" class="small">← Negócios</a>
  <section class="ficha-head">
    <h1>${esc(e.nome)}</h1>
    <div class="sub">${[e.cnpj && e.cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5"), e.porte, e.setor, e.cnae, e.cidade && `${e.cidade}${e.uf ? "/" + e.uf : ""}`, e.funcionarios && `${e.funcionarios} funcionários`].filter(Boolean).map(esc).join(" · ")}${inLink(e.linkedin)}</div>
    <div>${vig.length ? '<span class="tag-cli">Cliente</span>' : '<span class="tag-lead">Lead</span>'} <span class="sub">· relacionamento ${Math.round(e.score)} de 100</span></div>
    <div class="chips">${vig.length ? vig.map(n => vchip(n.vertical, n.produto + (n.fim ? ` · até ${mesAno(n.fim)}` : ""))).join("") : '<span class="sub">Nenhum seguro vigente</span>'}</div>
    ${temSaudeZeca ? "" : `<label class="check"><input type="checkbox" data-saude="${e.id}" ${vig.some(n => n.vertical === "saude") ? "checked" : ""}> Cliente Saúde${e.negocios.some(n => n.vertical === "saude" && n.status === "ganho" && !n.fim) ? " (ganho no Pipedrive; desmarque se cancelou)" : " (fora da planilha do Zeca)"}</label>`}
  </section>
  <section><h2>Negócios abertos</h2><div class="tabela"><table class="larga">
    <thead><tr><th>Potencial</th><th>Cliente/Lead</th><th>Temperatura</th><th>Quem decide</th><th>Seguros vigentes</th><th>Negócio aberto</th><th>Por quê</th><th>Notícias</th><th>Próximo passo</th></tr></thead>
    <tbody>${abertos.length ? abertos.map(linhaHTML).join("") : '<tr><td colspan="9" class="vazio">Nenhum negócio aberto nos funis acompanhados.</td></tr>'}</tbody></table></div></section>
  <section><h2>Pessoas</h2><div class="tabela"><table>
    <thead><tr><th>Nome</th><th>Cargo</th><th>Área</th><th>E-mail</th><th>Influência</th><th>Relação</th><th>Temperatura</th><th>Fala com</th></tr></thead>
    <tbody>${e.pessoas.map(p => `<tr><td>${p.focal ? '<span title="Ponto focal" style="color:var(--warn)">★</span> ' : ""}${esc(p.nome)}${inLink(p.linkedin)}${p.fonte === "linkedin" ? '<div class="sub">mapeado no LinkedIn</div>' : ""}${p.empresaAtual ? `<div class="sub" style="color:var(--warn)">LinkedIn: hoje em ${esc(p.empresaAtual)}</div>` : ""}</td><td>${esc(p.cargo || "")}${p.headline && p.headline !== p.cargo ? `<div class="sub" style="max-width:260px">${esc(p.headline)}</div>` : ""}</td><td class="small">${esc(p.area || "")}</td><td class="small">${esc(p.email || "")}</td>
      <td><b class="num">${Math.round(p.influencia ?? 0)}</b></td><td><span class="num">${Math.round(p.score)}</span>${p.i90 ? `<div class="sub">${p.i90} e-mails em 90 dias</div>` : ""}</td><td>${celulaTemp(p)}</td>
      <td class="small">${esc((p.usuarios || []).map(nomeDe).join(", "))}</td></tr>`).join("") || '<tr><td colspan="8" class="vazio">Nenhuma pessoa cadastrada.</td></tr>'}</tbody></table></div></section>
  <section><h2>Histórico de produtos</h2><div class="tabela"><table>
    <thead><tr><th>Vertical</th><th>Produto</th><th>Situação</th><th>Vigência</th><th>Valor</th><th>Origem</th></tr></thead>
    <tbody>${e.negocios.filter(n => n.vertical).map(n => `<tr><td>${vchip(n.vertical)}</td><td>${esc(n.produto)}</td><td>${situacao(n)}</td>
      <td class="small num">${dt(n.ini)}${n.fim ? " → " + dt(n.fim) : ""}</td><td class="num">${brl(n.valor)}</td><td class="small">${esc(n.fonte)}</td></tr>`).join("") || '<tr><td colspan="6" class="vazio">Nenhum produto.</td></tr>'}</tbody></table></div></section>
  <section><h2>Notícias</h2><div class="grupo not" style="padding:12px 14px">${e.noticias.length ? e.noticias.map(n => `${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a>` : `<span>${esc(n.titulo)}</span>`}<div class="sub">${esc(n.fonte || "")}${n.data ? " · " + dt(n.data) : ""}</div>`).join("") : '<span class="sub">Sem notícias recentes.</span>'}</div></section>`;
}

/* ---------- Eventos globais ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-ativ]"); if (b && !b.disabled) abrirAtividade(b.dataset.ativ);
  const o = ev.target.closest("[data-ativ-op]"); if (o && !o.disabled) abrirAtividadeOp(o.dataset.ativOp);
});
document.addEventListener("change", async ev => {
  const s = ev.target.dataset?.saude, c = ev.target.dataset?.concluir;
  try {
    if (s) { await api.post(`/api/empresas/${s}/saude`, {cliente: ev.target.checked}); aviso(ev.target.checked ? "Marcada como cliente Saúde" : "Desmarcada: não é mais cliente Saúde");
      if (!PREVIA) LINHAS = (await api.get("/api/tabela")).linhas; render(); }
    if (c) { await api.post(`/api/atividades/${c}/concluir`, {concluida: ev.target.checked}); telaTodos(); }
  } catch (err) { aviso(err.message); ev.target.checked = !ev.target.checked; }
});

async function render() {
  const h = location.hash || "#negocios";
  const m = h.match(/^#empresa-(\d+)$/);
  abas(m ? "negocios" : h.slice(1));
  try {
    if (m) await telaEmpresa(m[1]);
    else if (h === "#todos") await telaTodos();
    else if (h === "#oportunidades") await telaOportunidades();
    else if (h === "#qualidade") await telaQualidade();
    else if (h === "#equipe") await telaEquipe();
    else await telaNegocios();
  } catch (err) { if (err.message !== "login") document.getElementById("app").innerHTML = `<p class="vazio">${esc(err.message)}</p>`; }
}

(async () => {
  document.getElementById("demo").hidden = !PREVIA;
  document.getElementById("sair").hidden = PREVIA;
  try { EU = await api.get("/api/eu"); } catch (e) { return; }
  document.getElementById("eu").textContent = EU.nome;
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
