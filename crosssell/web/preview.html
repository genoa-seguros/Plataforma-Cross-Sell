<title>Innoa Cross Sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: barra superior + coluna única de 1200px; painel (KPIs > verticais > fila de oportunidades) e ficha da empresa por hash */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#15202b; --mute:#5c6b7a; --line:#dde3ea; --soft:#eef2f6;
  --accent:#0b5c72; --accent-ink:#ffffff; --warn:#a15c00; --good:#1d7a46;
  --lf:#5b45c4; --saude:#12805c; --re:#b86a00; --lp:#c0306b;
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#161e26; --ink:#e3e9ef; --mute:#93a3b3; --line:#283340; --soft:#1c2630;
  --accent:#4fb3cc; --accent-ink:#06222b; --warn:#e3a14a; --good:#5cc78d;
  --lf:#9a88f0; --saude:#4cc59a; --re:#e6a243; --lp:#ee6fa0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#161e26; --ink:#e3e9ef; --mute:#93a3b3; --line:#283340; --soft:#1c2630;
  --accent:#4fb3cc; --accent-ink:#06222b; --warn:#e3a14a; --good:#5cc78d;
  --lf:#9a88f0; --saude:#4cc59a; --re:#e6a243; --lp:#ee6fa0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
a{color:var(--accent)} a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px}
.top-in{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font:800 17px/1 var(--f-display);letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand span{color:var(--accent)}
.pill-demo{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--warn);border:1px solid var(--line)}
.top .meta{margin-left:auto;color:var(--mute);font-size:12px}
main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:22px}
h1{font:700 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
h2{font:700 15px/1.2 var(--f-display);margin:0 0 10px;letter-spacing:.01em}
.mute{color:var(--mute)} .small{font-size:12px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:2px}
.kpi b{font:700 28px/1.1 var(--f-display)}
.kpi .lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.verts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.vert{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:12px 16px;display:grid;gap:6px}
.vert .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:500;padding:1px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.chip.solid{background:var(--c);color:var(--surface);border-color:var(--c)}
.chip.off{--c:var(--mute);border-style:dashed;background:transparent}
.c-linhas_financeiras{--c:var(--lf)} .c-saude{--c:var(--saude)} .c-ramos_elementares{--c:var(--re)} .c-linhas_pessoais{--c:var(--lp)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filtros button.chip{cursor:pointer;font:inherit;font-size:12px}
.filtros button.chip[aria-pressed="true"]{background:var(--c);color:var(--surface)}
select,input[type=search]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input[type=search]{min-width:0;flex:1 1 180px}
.tabela{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;background:var(--soft)}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.score{display:grid;gap:4px;min-width:74px}
.score b{font:600 16px/1 var(--f-data)}
.bar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.comp{font-size:11px;color:var(--mute);font-family:var(--f-data)}
ul.mot{margin:0;padding-left:16px;display:grid;gap:2px;font-size:13px}
.pessoa{font-size:12px;color:var(--mute)}
.focal{color:var(--warn)}
.ficha-head{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.voltar{font-size:13px;text-decoration:none}
.vazio{padding:24px;text-align:center;color:var(--mute)}
.nota{font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#painel">Innoa <span>Cross Sell</span></a>
  <span class="pill-demo" id="demo" hidden>Prévia com dados de exemplo · empresas fictícias</span>
  <span class="meta" id="gerado"></span>
</div></header>
<main id="app"></main>

<script>
const D = /*__DADOS__*/null;
const L = D.verticais, U = D.usuarios;
const STATUS = {nova:"Nova", em_andamento:"Em andamento", convertida:"Convertida", descartada:"Descartada"};
const ESTADO = {cliente:"cliente", aberto:"em negociação, ainda não é cliente", ex:"ex-cliente", "":"não é cliente"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nome = e => e ? (U[e] || e) : "";
const nomes = l => (l || "").split(",").map(x => x.trim()).filter(Boolean).map(nome).join(", ");
const brl = v => v == null ? "" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL", maximumFractionDigits:0});
const dt = d => d ? d.split("-").reverse().join("/") : "";
const chip = (v, extra="") => `<span class="chip c-${v} ${extra}">${esc(L[v])}</span>`;

let local = {};
try { local = JSON.parse(localStorage.getItem("cs-status") || "{}"); } catch (e) {}
const statusDe = o => local[o.id] || o.status;
const filtro = {alvo:"", resp:"", status:"nova", q:""};

document.getElementById("demo").hidden = !D.exemplo;
document.getElementById("gerado").textContent = "Atualizado em " + D.geradoEm;

function painel() {
  const ops = D.oportunidades;
  const novas = ops.filter(o => statusDe(o) === "nova");
  const k = D.kpis;
  const porVert = Object.keys(L).map(v => {
    const cli = Object.values(D.empresas).filter(e => e.estado[v] === "cliente").length;
    const op = novas.filter(o => o.alvo === v).length;
    const funil = Object.values(D.empresas).filter(e => e.estado[v] === "aberto").length;
    return `<div class="vert c-${v}"><div class="chips">${chip(v)}</div>
      <div class="row"><span class="mute">Clientes vigentes</span><b class="num">${cli}</b></div>
      <div class="row"><span class="mute">Em negociação</span><b class="num">${funil}</b></div>
      <div class="row"><span class="mute">Oportunidades novas</span><b class="num">${op}</b></div></div>`;
  }).join("");
  const resps = [...new Set(ops.flatMap(o => (o.responsavel || "").split(",").map(x => x.trim()).filter(Boolean)))];
  return `
  <section class="kpis">
    <div class="kpi"><span class="lbl">Clientes vigentes</span><b class="num">${k.clientes}</b><span class="small mute">negócio ganho ou apólice ativa</span></div>
    <div class="kpi"><span class="lbl">Só em prospecção</span><b class="num">${k.prospeccao}</b><span class="small mute">funil aberto, nenhum ganho vigente</span></div>
    <div class="kpi"><span class="lbl">Clientes de 1 vertical</span><b class="num">${k.mono}</b><span class="small mute">${k.clientes ? Math.round(100 * k.mono / k.clientes) : 0}% da base · espaço de cross sell</span></div>
    <div class="kpi"><span class="lbl">Oportunidades novas</span><b class="num">${novas.length}</b><span class="small mute">${ops.length} no total</span></div>
  </section>
  <section class="verts">${porVert}</section>
  <section>
    <h2>Oportunidades</h2>
    <div class="filtros" role="group" aria-label="Filtros">
      <button class="chip off" id="f-todas" aria-pressed="${!filtro.alvo}">Todas</button>
      ${Object.keys(L).map(v => `<button class="chip c-${v}" data-alvo="${v}" aria-pressed="${filtro.alvo === v}">${esc(L[v])}</button>`).join("")}
      <select id="f-resp" aria-label="Quem atende"><option value="">Quem atende: todos</option>
        ${resps.map(r => `<option value="${esc(r)}" ${filtro.resp === r ? "selected" : ""}>${esc(nome(r))}</option>`).join("")}
        <option value="-" ${filtro.resp === "-" ? "selected" : ""}>A definir</option></select>
      <select id="f-status" aria-label="Status"><option value="">Status: todos</option>
        ${Object.entries(STATUS).map(([s, t]) => `<option value="${s}" ${filtro.status === s ? "selected" : ""}>${t}</option>`).join("")}</select>
      <input type="search" id="f-q" placeholder="Buscar empresa ou pessoa" value="${esc(filtro.q)}">
    </div>
    <div class="tabela"><table>
      <thead><tr><th>Score</th><th>Cliente</th><th>Hoje</th><th>Oferecer</th><th>Por quê</th><th>Quem apresenta</th><th>Quem atende</th><th>Status</th></tr></thead>
      <tbody id="linhas"></tbody></table></div>
    <p class="nota">Score = 45% relacionamento + 30% aderência + 25% momento. Nesta prévia, o status que você muda fica salvo só no seu navegador.</p>
  </section>`;
}

function linha(o) {
  const e = D.empresas[o.empresaId] || {};
  const c = o.comp || {};
  return `<tr>
    <td><div class="score"><b>${o.score.toFixed(0)}</b><div class="bar"><i style="width:${o.score}%"></i></div>
      <span class="comp" title="relacionamento · aderência · momento">${Math.round((c.relacionamento||0)*100)} · ${Math.round((c.aderencia||0)*100)} · ${Math.round((c.momento||0)*100)}</span></div></td>
    <td><a href="#empresa-${o.empresaId}">${esc(e.nome)}</a>${o.pessoa ? `<div class="pessoa">${esc(o.pessoa)}${o.cargo ? " · " + esc(o.cargo) : ""}</div>` : ""}</td>
    <td><div class="chips">${(o.atuais || []).map(v => chip(v)).join("")}</div></td>
    <td>${chip(o.alvo, "solid")}</td>
    <td><ul class="mot">${o.motivos.map(m => `<li>${esc(m)}</li>`).join("")}</ul></td>
    <td class="small">${esc(nome(o.ponte)) || '<span class="mute">sem contato registrado</span>'}</td>
    <td class="small">${esc(nomes(o.responsavel)) || '<span class="mute">a definir</span>'}</td>
    <td><select data-op="${o.id}" aria-label="Status da oportunidade">${Object.entries(STATUS).map(([s, t]) => `<option value="${s}" ${statusDe(o) === s ? "selected" : ""}>${t}</option>`).join("")}</select></td>
  </tr>`;
}

function filtrar() {
  const q = filtro.q.toLowerCase();
  const ops = D.oportunidades.filter(o =>
    (!filtro.alvo || o.alvo === filtro.alvo) &&
    (!filtro.status || statusDe(o) === filtro.status) &&
    (!filtro.resp || (filtro.resp === "-" ? !o.responsavel : (o.responsavel || "").includes(filtro.resp))) &&
    (!q || (D.empresas[o.empresaId]?.nome || "").toLowerCase().includes(q) || (o.pessoa || "").toLowerCase().includes(q)));
  const tb = document.getElementById("linhas");
  tb.innerHTML = ops.length ? ops.map(linha).join("") : `<tr><td colspan="8" class="vazio">Nenhuma oportunidade com esses filtros.</td></tr>`;
}

function empresa(id) {
  const e = D.empresas[id];
  if (!e) return `<p>Empresa não encontrada. <a href="#painel">Voltar</a></p>`;
  const ops = D.oportunidades.filter(o => o.empresaId == id);
  const c = e.comp || {};
  return `
  <a class="voltar" href="#painel">← Oportunidades</a>
  <section class="ficha-head">
    <h1>${esc(e.nome)}</h1>
    <div class="mute small">${[e.cnpj && e.cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5"), e.porte, e.cnae, e.cidade && `${e.cidade}/${e.uf}`].filter(Boolean).map(esc).join(" · ")}</div>
    <div class="chips">${Object.keys(L).map(v => `<span class="chip c-${v} ${e.estado[v] === "cliente" ? "solid" : e.estado[v] ? "" : "off"}">${esc(L[v])} · ${ESTADO[e.estado[v]]}</span>`).join("")}</div>
  </section>
  <section class="kpis">
    <div class="kpi"><span class="lbl">Relacionamento</span><b class="num">${e.score.toFixed(0)}</b><span class="small mute">de 100</span></div>
    <div class="kpi"><span class="lbl">Contatos ativos</span><b class="num">${c.contatos_ativos || 0}</b><span class="small mute">score ≥ 20</span></div>
    <div class="kpi"><span class="lbl">Acesso a decisor</span><b>${c.acesso_decisor ? "Sim" : "Não"}</b><span class="small mute">sócio, C-level ou diretor</span></div>
    <div class="kpi"><span class="lbl">Funcionários</span><b class="num">${e.funcionarios ?? "—"}</b><span class="small mute">${esc(e.porte || "")}</span></div>
  </section>
  <section><h2>Oportunidades</h2><div class="tabela"><table>
    <thead><tr><th>Score</th><th>Cliente</th><th>Hoje</th><th>Oferecer</th><th>Por quê</th><th>Quem apresenta</th><th>Quem atende</th><th>Status</th></tr></thead>
    <tbody>${ops.length ? ops.map(linha).join("") : `<tr><td colspan="8" class="vazio">Nenhuma oportunidade para esta empresa.</td></tr>`}</tbody></table></div></section>
  <section><h2>Pessoas</h2><div class="tabela"><table>
    <thead><tr><th>Nome</th><th>Cargo</th><th>E-mail</th><th>Relação</th><th>Fala com</th><th>Origem</th></tr></thead>
    <tbody>${e.pessoas.map(p => `<tr>
      <td>${p.focal ? '<span class="focal" title="Ponto focal">★</span> ' : ""}${esc(p.nome)}</td><td>${esc(p.cargo)}</td><td class="small">${esc(p.email)}</td>
      <td><b class="num">${p.score.toFixed(0)}</b>${p.i90 ? `<div class="small mute">${p.i90} e-mails em 90 dias · último há ${p.dias} d</div>` : ""}</td>
      <td class="small">${esc((p.usuarios || []).map(nome).join(", "))}</td><td class="small">${esc(p.fonte)}</td></tr>`).join("") || `<tr><td colspan="6" class="vazio">Nenhuma pessoa cadastrada.</td></tr>`}</tbody></table></div></section>
  <section><h2>Produtos</h2><div class="tabela"><table>
    <thead><tr><th>Vertical</th><th>Produto</th><th>Seguradora</th><th>Situação</th><th>Vigência</th><th>Valor</th><th>Origem</th></tr></thead>
    <tbody>${e.negocios.map(n => `<tr><td>${chip(n.vertical)}</td><td>${esc(n.titulo)}</td><td>${esc(n.seguradora)}</td>
      <td>${n.vigente ? "Vigente" : n.status === "aberto" ? "Em negociação" : n.status === "cancelado" ? "Cancelado" : n.status === "perdido" ? "Perdido" : "Vencido"}</td>
      <td class="small num">${dt(n.ini)}${n.fim ? " → " + dt(n.fim) : ""}</td><td class="num">${brl(n.valor)}</td><td class="small">${esc(n.fonte)}</td></tr>`).join("") || `<tr><td colspan="7" class="vazio">Nenhum produto.</td></tr>`}</tbody></table></div></section>`;
}

function render() {
  const app = document.getElementById("app");
  const m = location.hash.match(/^#empresa-(\d+)$/);
  if (m) { app.innerHTML = empresa(m[1]); }
  else { app.innerHTML = painel(); filtrar(); ligarFiltros(); }
  window.scrollTo(0, 0);
}

function ligarFiltros() {
  document.querySelectorAll("[data-alvo]").forEach(b => b.onclick = () => { filtro.alvo = filtro.alvo === b.dataset.alvo ? "" : b.dataset.alvo; render(); });
  document.getElementById("f-todas").onclick = () => { filtro.alvo = ""; render(); };
  document.getElementById("f-resp").onchange = ev => { filtro.resp = ev.target.value; filtrar(); };
  document.getElementById("f-status").onchange = ev => { filtro.status = ev.target.value; filtrar(); };
  document.getElementById("f-q").oninput = ev => { filtro.q = ev.target.value; filtrar(); };
}

document.addEventListener("change", ev => {
  const id = ev.target.dataset?.op;
  if (!id) return;
  local[id] = ev.target.value;
  try { localStorage.setItem("cs-status", JSON.stringify(local)); } catch (e) {}
});
window.addEventListener("hashchange", render);
render();
</script>
