<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Entrar{% endblock %} · Innoa Cross Sell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@700;800&display=swap">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#15202b;--mute:#5c6b7a;--line:#dde3ea;--accent:#0b5c72;--accent-ink:#fff;--erro:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#161e26;--ink:#e3e9ef;--mute:#93a3b3;--line:#283340;--accent:#4fb3cc;--accent-ink:#06222b;--erro:#f97066;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:16px}
.caixa{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:16px}
.marca{font:800 19px/1 Manrope,system-ui,sans-serif}.marca span{color:var(--accent)}
h1{font:700 17px/1.3 Manrope,system-ui,sans-serif;margin:0}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.erro{color:var(--erro);font-size:13px;margin:0}.nota{color:var(--mute);font-size:13px;margin:0}
</style>
</head>
<body><main class="caixa"><div class="marca">Innoa <span>Cross Sell</span></div>{% block corpo %}{% endblock %}</main></body>
</html>
