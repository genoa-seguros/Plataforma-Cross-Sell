<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Cross Sell{% endblock %} · Innoa</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e4e7ec;--accent:#0f5bd8;
--lf:#6d4bd8;--saude:#0e9f6e;--re:#d97706;--lp:#db2777}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c25;--ink:#e6e8ee;--mute:#98a2b3;--line:#2a3040;--accent:#5b9bff}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:16px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
header a{color:inherit;text-decoration:none;font-weight:600}main{max-width:1200px;margin:0 auto;padding:20px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi{font-size:26px;font-weight:700}.mute{color:var(--mute)}.small{font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}a{color:var(--accent)}
.tag{display:inline-block;white-space:nowrap;padding:1px 8px;border-radius:99px;font-size:12px;color:#fff;margin:1px}
.linhas_financeiras{background:var(--lf)}.saude{background:var(--saude)}.ramos_elementares{background:var(--re)}.linhas_pessoais{background:var(--lp)}
.off{background:transparent;color:var(--mute);border:1px dashed var(--line)}.aberto{opacity:.55}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--accent)}
form.inline{display:inline}select,input,button{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer}h2{font-size:16px;margin:24px 0 10px}ul{margin:0;padding-left:18px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><a href="/">Innoa · Cross Sell</a></header>
<main>{% block corpo %}{% endblock %}</main>
</body></html>
