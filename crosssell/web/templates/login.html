{% extends "_acesso.html" %}
{% block corpo %}
<h1>Entrar</h1>
{% if aviso %}<p class="ok" role="status">{{ aviso }}</p>{% endif %}
<form method="post" action="/login">
  <label>E-mail <input type="email" name="email" id="email" value="{{ email or '' }}" autocomplete="username" required {% if not email %}autofocus{% endif %}></label>
  <label>Senha <span class="senha"><input type="password" name="senha" id="senha" autocomplete="current-password" required {% if email %}autofocus{% endif %}><button type="button" data-mostrar="senha" aria-pressed="false">Mostrar</button></span></label>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <button>Entrar</button>
</form>
<div class="linha"><a href="/esqueci">Esqueci minha senha</a></div>
<p class="nota">O acesso é feito por convite. Peça ao administrador se ainda não tiver o seu.</p>
{% endblock %}
