# Site da plataforma no Nginx que já roda na zeca-server (a API do Zeca tem o próprio arquivo).
# Copiar para /etc/nginx/sites-available/crosssell e ativar (ver deploy/LEIA-ME.md, passo 5).
# O Certbot (`certbot --nginx -d crosssell.coinsure.com.br`) acrescenta aqui o bloco HTTPS e o
# redirecionamento de HTTP para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name crosssell.coinsure.com.br;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;   # PORTA_LOCAL do deploy/.env
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
