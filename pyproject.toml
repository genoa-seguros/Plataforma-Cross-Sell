[project]
name = "crosssell"
version = "0.1.0"
description = "Plataforma de Cross Sell entre verticais da Innoa"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "typer>=0.12",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crosssell = "crosssell.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crosssell*"]

[tool.setuptools.package-data]
crosssell = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
